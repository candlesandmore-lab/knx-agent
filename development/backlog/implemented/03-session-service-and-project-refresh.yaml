schema_version: 1
story:
  id: 3
  title: "Implement investigation session lifecycle and project refresh"
  state: implemented
  created_on: "2026-10-24"
  last_updated_on: "2026-10-24"
  source_todo:
    - "development/todos/03-session-service-and-project-refresh.md"
  actor: "End user (domain expert investigating a KNX installation)"
  goal: "Provide a working investigation-session lifecycle on SDK, CLI and MCP: create_session (mandatory .knxproj guard), describe_session with real persisted data, reimport_system_definition, and an automatic project refresh check on every public session-scoped call. A session is addressed only by its user-chosen session_label, lives in <session_root>/<session_label>, persists its metadata in session-state.yaml, and starts a KNX session log book, so later slices can rely on a self-healing session contract."
  success_criteria:
    - "create_session(project_path, session_label) on SDK (KnxSessionClient), CLI (knx-agent session create --project <file> --session-label <session_label>) and MCP (create_session) rejects a missing or unreadable file (PROJECT_FILE_UNREADABLE) and a file that is not a .knxproj zip archive (PROJECT_PARSE_ERROR); describe_session and reimport_system_definition (CLI session describe / session reimport, MCP tools of the same name) return the catalogue responses from docs/implementation/003 (capabilities 1-3) including the C7 envelope; describe_session replaces the placeholder from story 02 with real persisted data."
    - "A session_label is non-empty, uses letters, digits, - and _ only (else SESSION_LABEL_INVALID) and is unique under the session root (else SESSION_LABEL_EXISTS); the work-directory is <session_root>/<session_label>; session_root defaults to ./.knx-agent/sessions and is set via the CLI option --session-root, the MCP server startup argument --session-root and the SDK parameter session_root= on KnxSessionClient; no environment variable is read; an unknown session_label yields SESSION_NOT_FOUND. create_session validates in this order: session_label validity (SESSION_LABEL_INVALID), project file readability (PROJECT_FILE_UNREADABLE), archive validity (PROJECT_PARSE_ERROR), label uniqueness (SESSION_LABEL_EXISTS); it is atomic (work-directory is built in a temporary sibling folder and renamed, and removed on any failure), so a failed create never leaves a folder that blocks the label."
    - "session-state.yaml is written at creation and kept current with: session_label, created_at, work_directory, source_project_absolute_path, project_import (path, mtime, size, imported_at, project_import_summary with a limitation note that .knxproj content import is not implemented yet, fingerprint: null), project_refresh, active_setup (default), trace_artifacts [], scenario_state [], mutations [], log_book_references and mutation_log_book_references; there is no separate session_id and no implicit active session."
    - "Every public session-scoped SDK operation (CLI and MCP go through the SDK) first runs the refresh check comparing path existence, mtime and size with the stored project_import; a difference triggers an automatic re-import and an updated project_refresh before the operation proceeds; reimport_system_definition forces the same re-read and reports CHANGED or UNCHANGED; the check is idempotent (two runs without a project change give identical session-state.yaml content and no re-import). If the bound file is missing or unreadable during a refresh, the operation fails with PROJECT_FILE_UNREADABLE and session-state.yaml stays unchanged; session-state.yaml is always written atomically (temporary file then rename) so a failed re-import leaves the previous state intact. Known limitation until the fingerprint exists (todo 04): a content change that keeps mtime and size is not detected; reimport_system_definition covers that case manually."
    - "The KNX session log book is initialised at creation as the append-only JSON Lines file session-log-book.jsonl in the work-directory with entries of entry_id, timestamp, level, capability, setup, summary and details; lifecycle events (create, automatic re-import, explicit reimport) are written at INFO, successful and unchanged refresh checks at DEBUG, and every issue (failed refresh check, missing/unreadable project file, failed re-import, any raised catalogue error) at ERROR, according to a log point table authored in docs/implementation/003, with the level chosen per call (log_level on SDK/CLI, startup argument for MCP) per catalogue convention C6; ERROR entries are always written whatever log_level is configured, go to the Python logging framework (logger 'knx_agent') and, when a session exists, to the KNX session log book as level ERROR; the MCP server starts via the new console script knx-agent-mcp with --session-root and --log-level. (User decisions 2026-10-24.)"
  architecture_options:
    - id: arch-a
      label: "Single SessionService in the application layer"
      description: "One service owns create, describe, reimport and session lookup and calls the refresh guard before every session-scoped operation; session-state.yaml is the single source of truth on disk and is re-read on each call."
      trade_offs: "Simple ownership; may grow as later slices add session-scoped operations. NOT chosen (decision 2026-10-24: the refresh check must be testable in isolation and applied uniformly, so arch-b)."
    - id: arch-b
      label: "SessionLifecycle plus ProjectRefreshGuard as separate collaborators"
      description: "A lifecycle component handles create/describe/lookup; a refresh guard wraps every public session-scoped operation, checks path/mtime/size, triggers re-import and updates session-state.yaml; a service composes both."
      trade_offs: "Better isolation and unit-testing of the guard; slightly more indirection. CHOSEN (decision 2026-10-24, internal code structure; no end-user impact)."
  implementation_options:
    - id: impl-a
      label: "PyYAML with Pydantic model for session-state.yaml"
      description: "Typed Pydantic model serialised to a dict and written with PyYAML (pyyaml is already a dev dependency; it becomes a runtime dependency)."
      trade_offs: "Light and consistent with the Pydantic contracts; comments in the file are not preserved (not required). CHOSEN (decision 2026-10-24, internal)."
    - id: impl-b
      label: "ruamel.yaml for round-trip fidelity"
      description: "Preserves comments and ordering."
      trade_offs: "Heavier dependency and a further license record; not needed. NOT chosen."
    - id: impl-c
      label: "KNX session log book as append-only JSON Lines file"
      description: "One JSON object per line in session-log-book.jsonl: cheap appends, partial reads, no rewrite of earlier entries."
      trade_offs: "Less human-pretty than YAML, but users read it through read_session_log_book (todo 08). CHOSEN (decision 2026-10-24, internal file format)."
    - id: impl-d
      label: "KNX session log book as YAML multi-document file"
      description: "Human-friendly entries separated by document markers."
      trade_offs: "Appends need careful handling and partial reads are harder. NOT chosen."
