  guidelines:
    - "session_label is the only session identifier on all surfaces; there is no session_id and no implicit active session. 'Active' only refers to the active setup (default) stored as active_setup."
    - "Canonical terms: KNX session log book (not logbook), work-directory, session-state.yaml, reimport_system_definition (not refresh), scenario state, KnxSessionClient (docs/methodology/02-terminology-dictionary.md)."
    - "Out of scope: parsing .knxproj into a project graph (todo 04; fingerprint stays null and is deferred there), select_setup, mutations and read_session_log_book (todo 08), trace content (todo 05), scenario state content (todo 06)."
    - "Never swallow a missing or unreadable .knxproj: raise a typed error carrying the catalogue error code."
    - "Single-writer assumption: one process works on a session at a time; concurrent access to the same session is out of scope and documented in README.md."
    - "User decisions 2026-10-24: 'any issue should be logged as ERROR, use the python logging framework' (standard logging module, logger 'knx_agent' and children, no custom logging code beyond configuring a handler in the CLI and MCP entry points; ERROR always written and also appended to the session log book when a session exists); the MCP command is the new console script knx-agent-mcp. ERROR is new to the catalogue level list INFO/DEBUG/FULL: catalogue update in docs/implementation/003, follow-up for read_session_log_book min_level in todo 08."
    - "The log point table (lifecycle events at INFO, unchanged refresh checks at DEBUG, every failure at ERROR) is a deliverable of this story, authored in docs/implementation/003 (section on log books, convention C6); response envelope is convention C7 and capabilities 1-3 are the entries create_session, reimport_system_definition and describe_session in the same file."
    - "Terms already in docs/methodology/02-terminology-dictionary.md: KNX session log book, Work-directory, Session state, session_label, KnxSessionClient. 'Session root' (the folder holding all work-directories) is a new term; add it to the dictionary only after confirming the canonical form with the user (Maintenance Rule)."
    - "Deferred follow-up ids in this repository are development todo paths (the Shipped-Asset Alignment rule accepts a concrete backlog story or todo id); they are converted to story ids when the backlog stories are created."
    - "Layer rule from story 02 holds: cli/adapters -> sdk -> application -> domain; the refresh guard lives in the application layer so CLI and MCP get it through the SDK."
    - "Every behaviour is tested with pytest, SDK-first, with data-driven YAML fixtures under tests/fixtures (cases for labels, error codes, mtime/size change); temporary work-directories only (tmp_path), small synthetic .knxproj zip fixtures created by the tests."
    - "Document the new options (--session-root, session_root=) and the session folder layout in README.md."
    - "Add the new dependency decisions (pyyaml as runtime dependency) to the later license record (todo 12)."
