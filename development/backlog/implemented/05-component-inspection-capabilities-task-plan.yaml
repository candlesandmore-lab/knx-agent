story_task_plan:
  story: "development/backlog/active/05-component-inspection-capabilities.yaml"
  spec_reference: "docs/implementation/003-proposed-capability-apis.md (section 'Component inspection (story 05)', capabilities 6-9, conventions C3, C4, C6, C7, sections 'Project import and project graph (story 04)' and 'Session service realisation (story 03)'); docs/architecture/001-knx-investigation-platform.md section 3 (unchanged); docs/methodology/02-terminology-dictionary.md (rows Location, Instance path, Selector, Detail level)"
  decisions:
    architecture: "No-change decision: docs/architecture/001 section 3 already assigns the query layer to a later story that reads the persisted project graph; no boundary, layer or data contract changes. docs/architecture is not edited."
    arch_a: "Chosen by the user (2026-10-24): QueryService in the application layer; project-graph.json is loaded and indexed on every call, nothing cached between calls."
    impl_a_b: "Chosen: selector parsing and matching as pure domain functions (impl-a); one internal ComponentView with SUMMARY/MEDIUM/FULL as projections (impl-b)."
    user_decisions: "Instance path = location path plus component name joined by '/'; location = space of the location tree; partial name and path case-insensitive substrings, individual address and ETS id exact; three distinct detail levels; trace_group_flow direct participants only, direction from ETS flags only (link order not used), current_value unknown; list no match = empty set, describe no match = SELECTOR_UNRESOLVED; explicit selector_kind not fitting = INVALID_REQUEST; mutation_name accepted but MUTATION_NOT_FOUND until todo 08; read-only, no own log book entry, failures ERROR."
    architect_decisions_to_confirm_at_review: "(1) ANY always evaluates NAME, adds INDIVIDUAL_ADDRESS / ETS_ID when the syntax fits and INSTANCE_PATH only when the value contains '/'; matches carry match_kinds. (2) Path query: leading '/' anchors at the root, trailing '/' is a location query ('EG/Wohnzimmer/' lists the room), segments are consecutive path segments each matched as a case-insensitive substring. (3) Empty component name uses the individual address as path segment; empty space name uses its ETS id. (4) Group address selector: valid address form (3-level always, project style additionally) = exact, else partial name; communication_object_ref = exact communication object node id. (5) Direction values SENDER / RECEIVER / SENDER_RECEIVER / UNDETERMINED from transmit, write, update flags; read flag only adds the role ANSWERS_READ; communication flag shown, not evaluated. (6) mutation_name 'default' is accepted as the default setup. (7) A corrupt project-graph.json raises PROJECT_PARSE_ERROR reason GRAPH_FILE_INVALID (no hidden re-import). (8) Order of operations: log level, session, refresh check, request validation, graph load. (9) No result limit or paging in this story (FULL on the whole project is large; documented limitation)."
    terms: "Use exactly: component, instance path (instance_path), location, selector, detail level, project graph, source fact, derived fact, component typing, session_label, capability. No 'device'/'object' as a synonym of component (the ETS names DeviceInstance and ComObject appear only inside quoted XML names)."
  existing_code_note: "Stories 1-4 are merged. Reusable: domain/project_graph.py (ProjectGraph, node classes, format_group_address), domain/derivation.py, application/graph_store.read_graph (GraphReadResult with problem MISSING/UNREADABLE/INVALID), SessionLifecycle.work_directory/load, ProjectRefreshGuard.check(state, work_directory, log_book, capability), SessionLogBook, SessionService._envelope/_report_error (to be shared, see T1), contracts ResponseEnvelope/DetailLevel/EvidenceKind/KnxAgentError/error(), KnxSessionClient, typer app (_run helper, session_app), MCP server (_call, _client). Missing: error constants SELECTOR_UNRESOLVED, MUTATION_NOT_FOUND, INVALID_DETAIL_LEVEL; no SelectorKind enum; no 'setup' CLI group."
  ordered_tasks:
    - id: T1
      owner: python-creation-agent
      title: "Contracts, error constants and shared error reporting"
      description: "contracts: new file contracts/query_models.py (do NOT grow models.py) with SelectorKind (StrEnum ANY, NAME, INSTANCE_PATH, INDIVIDUAL_ADDRESS, ETS_ID), the four request models and four response models, the per-level component views (ComponentSummaryView -> ComponentMediumView -> ComponentFullView, each extending the previous; blocks identity, derived, match_kinds, topology, component_parameters, group_addresses, communication_objects, product, application, engineering_metadata exactly as in the 003 table), the topology summary models (counts, locations_by_type, areas/lines, locations, FULL component lists, component_counts) and the flow models per level (group_address, participants, propagation_path, unresolved_links, current_value) with SerializeAsAny in the response models so that each level serialises ONLY its own fields (absent, not null); extra='forbid'; envelope reused unchanged; no purpose_annotation / purpose_summary field. contracts/errors.py: constants SELECTOR_UNRESOLVED, MUTATION_NOT_FOUND, INVALID_DETAIL_LEVEL plus INVALID_REQUEST reason constants (SELECTOR_BLANK, SELECTOR_MISSING, SELECTOR_CONFLICT, SELECTOR_KIND_UNKNOWN, SELECTOR_KIND_MISMATCH, SELECTOR_KIND_WITHOUT_SELECTOR) and PROJECT_PARSE_ERROR reason GRAPH_FILE_INVALID (add to import_codes.PROJECT_PARSE_ERROR_REASONS); export everything in contracts/__init__.py. contracts imports nothing from knx_agent. application/error_reporting.py: move SessionService._report_error into a shared function report_error(exc, capability, work_directory, level) used by SessionService (behaviour unchanged, existing tests stay green). Parsing helpers parse_detail_level(value) (case-insensitive, None -> MEDIUM, else INVALID_DETAIL_LEVEL with details.allowed) and parse_selector_kind(value) (None -> ANY, unknown -> INVALID_REQUEST SELECTOR_KIND_UNKNOWN) live in contracts/ or application/ (not domain I/O)."
      shared_files: "OWNS contracts/query_models.py, contracts/errors.py, contracts/import_codes.py, contracts/__init__.py, application/error_reporting.py, application/session_service.py (only the report_error extraction), tests/test_contracts.py (additions)."
      depends_on: []
      done_when: "Models validate and serialise per level (a SUMMARY view JSON has no topology key; a MEDIUM view has no communication_objects key); detail_level / selector_kind parsing tests (data-driven in tests/fixtures/query_request_cases.yaml) pass; SessionService tests unchanged and green; import-direction test passes."
    - id: T2
      owner: python-creation-agent
      title: "Domain: graph index, selector parsing and matching, graph factory for tests"
      description: "domain/graph_index.py: GraphIndex.build(ProjectGraph) with component_by_id, ordered component list (area, line, device numeric from individual_address; unparsable last; then id), area/line lookup, space_by_id with parent chain, instance paths per component (segment list per placement, sorted by space id; segment fallbacks: empty space name -> space ETS id, empty component name -> individual_address else ETS id; cycle stop), objects by component, parameters by component, group address by id and raw, memberships by group address and by object, group range chain, application program by id, warnings by communication object id (from the persisted warnings, location suffix after '#'). domain/selectors.py: parse and validate component selectors per the 003 table (INDIVIDUAL_ADDRESS regex plus ranges and normalisation of leading zeros, ETS_ID regex, NAME casefold substring, INSTANCE_PATH segment matching with leading '/' anchor and trailing '/' location query), kind detection for ANY (NAME always, plus fitting exact kinds, INSTANCE_PATH only with '/'), match_kinds per component, union without duplicates; explicit-kind mismatch raises KnxAgentError INVALID_REQUEST with the documented details.reason; blank / missing handling; group address selector parsing (3-level form always, project style TwoLevel / Free additionally, range checks, else name; out-of-range address form = name) and communication object ref parsing. Pure: no I/O. tests/graph_factory.py (tests only): build a ProjectGraph from a compact YAML description (areas, lines, spaces tree, components with line and placement, communication objects with flags and datapoint types, group addresses, memberships, parameters, warnings) so that domain tests need no archives. Data-driven YAML fixtures: tests/fixtures/selector_cases.yaml (graph description + selector + kind -> expected component ids and match_kinds or expected error reason) covering: name partial and case-insensitive, name with no match, component without name, individual address exact, with leading zeros, out of range under ANY (falls back to name) and under explicit kind (INVALID_REQUEST), ETS id exact case-sensitive, malformed ETS id under explicit kind, ANY overlap cases in a dedicated block tests/fixtures/selector_overlap_cases.yaml (a component named exactly like another component's individual address '1.1.5' -> two components, the first with match_kinds [INDIVIDUAL_ADDRESS] or [INDIVIDUAL_ADDRESS, NAME] as applicable; one component named '1.1.5' that also has that individual address -> ONE component, match_kinds [INDIVIDUAL_ADDRESS, NAME], match_count 1; a component named like an ETS id -> matched by NAME and ETS_ID merged; a component name containing '/' matched by NAME and INSTANCE_PATH merged under ANY; value without '/' never evaluates INSTANCE_PATH; IA and ETS id syntaxes never both fit; mixed results ordered by component order not by kind; explicit kinds give a single-element match_kinds and no overlap; match_kinds sorted without duplicates), instance path single segment, multi segment, consecutive-segment rule (non-adjacent segments do not match), leading '/', trailing '/', nested locations of 4 levels, unplaced component (no path, never matched by path), empty component name and empty space name fallbacks, name containing '/', component placed twice, parent cycle, ANY union (a name that also is an address), blank selector, selector_kind without selector. tests/fixtures/group_address_selector_cases.yaml for ThreeLevel / TwoLevel / Free projects (valid forms, forms valid only in another style, out of range, partial names, unnamed addresses, nonexistent address) and object refs."
      shared_files: "OWNS domain/graph_index.py, domain/selectors.py, tests/graph_factory.py, tests/test_graph_index.py, tests/test_selectors.py, tests/fixtures/selector_cases.yaml, tests/fixtures/selector_overlap_cases.yaml, tests/fixtures/group_address_selector_cases.yaml. Reads contracts from T1 (error helper, SelectorKind)."
      depends_on: [T1]
      done_when: "All selector and index cases pass; the index is built without mutating the graph; domain has no I/O; import-direction test passes."
    - id: T3
      owner: python-creation-agent
      title: "Domain: component view model and detail level projections"
      description: "domain/component_view.py: build one internal ComponentView per component from the GraphIndex (identity with instance_path and other_instance_paths, derived typing incl. rule id and basis, topology area / line / location_path, parameters ordered per spec, group addresses, communication objects with flags and linked group addresses ordered by (link_order, address_raw), product, application, engineering metadata) and project it to the contract views of T1 for SUMMARY, MEDIUM and FULL with exactly the fields of the 003 table (higher-level fields absent). list/describe assembly functions list_components(index, selector, kind, level) -> (views, ambiguous) and describe_components (raises SELECTOR_UNRESOLVED with details selector, selector_kind, evaluated_kinds when empty); component ordering per spec; limitation notes builder for the exact sentences in 003 (always-note, raw-parameter note, unresolved-definition counts, unplaced count, no-location note). Derived facts only in the `derived` block, never mixed into identity. Data-driven fixtures tests/fixtures/component_detail_level_cases.yaml (graph description -> expected JSON subset per level; assert key presence/absence per level for all three levels incl. a component without area / line / location / program node / parameters and an unresolved-definition object) and tests/fixtures/describe_component_cases.yaml (unambiguous, ambiguous set with ambiguous true, SELECTOR_UNRESOLVED, list empty set)."
      shared_files: "OWNS domain/component_view.py, tests/test_component_view.py, tests/fixtures/component_detail_level_cases.yaml, tests/fixtures/describe_component_cases.yaml. Uses (read only) T1 contracts and T2 index/selectors."
      depends_on: [T1, T2]
      done_when: "Each level contains exactly the documented fields; the three levels are distinct (SUMMARY is a strict subset of MEDIUM, MEDIUM of FULL); notes match the documented sentences; no purpose fields."
    - id: T4
      owner: python-creation-agent
      title: "Domain: topology summary"
      description: "domain/topology_summary.py: summarize(index, level) -> topology_summary + component_counts per the 003 structure (SUMMARY counts, locations_by_type, by_component_type; MEDIUM areas/lines with component counts, depth-first flat location list with path, depth, direct and total counts, unplaced_component_count, unassigned_to_line; FULL component lists under lines, locations and unplaced) with the deterministic ordering rules and the limitation notes (no locations, unplaced, unassigned to line). Fixtures tests/fixtures/topology_summary_cases.yaml (graph description -> expected summary per level): no locations, one location, 4-level nesting with counts at inner nodes, unplaced components, component without line, empty project, two areas with the backbone line 0."
      shared_files: "OWNS domain/topology_summary.py, tests/test_topology_summary.py, tests/fixtures/topology_summary_cases.yaml. Reads T1, T2."
      depends_on: [T1, T2]
      done_when: "Counts add up (sum of line counts + unassigned = components; sum of direct location counts + unplaced = components); levels distinct; fixtures pass."
    - id: T5
      owner: python-creation-agent
      title: "Domain: group address flow"
      description: "domain/group_flow.py: trace(index, group_address_selector | communication_object_ref, level) -> flow entries per the 003 table: matched group addresses (ordered by address_raw), participants from memberships (component order, object_number, object id), direction and roles from the ETS flags only per the exact rule (link order never consulted; null flags -> UNDETERMINED; read-only object -> UNDETERMINED with ANSWERS_READ), propagation_path {scope DIRECT_PARTICIPANTS, senders, receivers}, unresolved_links from the persisted warnings (GROUP_ADDRESS_LINK_UNRESOLVED, COMOBJECT_DEFINITION_UNRESOLVED by object id) plus objects with definition_resolved false, current_value 'unknown', range_path at FULL; exactly-one rule (SELECTOR_CONFLICT / SELECTOR_MISSING / SELECTOR_BLANK); SELECTOR_UNRESOLVED for unknown address, name and object ref; object ref without links -> empty list plus note; limitation notes with the documented sentences. Fixtures tests/fixtures/group_flow_cases.yaml: single sender / several receivers, SENDER_RECEIVER, UNDETERMINED (null flags, read-only), the same component through two objects, a test that reversing the membership order does not change directions (proves link order is not used), partial name multi-match with ambiguous true and entries ordered by address, exact address in ThreeLevel and TwoLevel and Free projects, nonexistent address, unresolved link warning attached to the participating object, object ref with two group addresses, object ref without link, every level shape."
      shared_files: "OWNS domain/group_flow.py, tests/test_group_flow.py, tests/fixtures/group_flow_cases.yaml. Reads T1, T2."
      depends_on: [T1, T2]
      done_when: "All direction and selector cases pass; link-order independence proven; entries carry only the fields of their level."
    - id: T6
      owner: python-creation-agent
      title: "Application: QueryService with graph loading, refresh check and logging rules"
      description: "application/query_service.py: QueryService(session_root, log_level) with list_components, describe_component, summarize_topology, trace_group_flow following the order of operations in 003 (log level, session label / SESSION_NOT_FOUND via SessionLifecycle, ProjectRefreshGuard.check with the calling capability name, request validation incl. detail level, mutation_name rule (None/empty/'default' = default, else MUTATION_NOT_FOUND), graph_store.read_graph (problem INVALID/UNREADABLE -> PROJECT_PARSE_ERROR reason GRAPH_FILE_INVALID), GraphIndex, domain call, envelope: setup default, evidence KNXPROJ with the absolute source project path, limitation_notes from the domain, log_book_entry_id of the refresh entry or null, detail_level echoed). Read-only: NO log book entry of its own at any log level; every raised KnxAgentError and unexpected exception goes through report_error (ERROR, always written, Python logger). Reuse the guard and lifecycle objects of SessionService (share one construction helper rather than copying). Update application/__init__.py. Tests (tests/test_query_service.py, synthetic archives from tests/knxproj_builder.py extended ONLY by new builder options if needed: locations tree, communication object flags, links): refresh check runs on every call (changed project is re-imported before the query, INFO entry 'changed, automatic re-import done' carries the calling capability name; unchanged check writes the DEBUG entry only at DEBUG), result reflects the re-imported project, no log book entry other than refresh entries after successful queries (log book line count compared before and after for INFO, DEBUG, FULL), failures write exactly one ERROR entry with the code (SELECTOR_UNRESOLVED, INVALID_REQUEST reasons, INVALID_DETAIL_LEVEL, MUTATION_NOT_FOUND, SESSION_NOT_FOUND has no log book, PROJECT_FILE_UNREADABLE after deleting the project, corrupt graph file), validation order (refresh before validation), envelope content, result identical for two consecutive calls, session-state.yaml byte-identical after queries on an unchanged project."
      shared_files: "OWNS application/query_service.py, application/__init__.py, tests/test_query_service.py, tests/fixtures/query_error_cases.yaml, tests/fixtures/query_log_cases.yaml. SHARED with T7 and T8: tests/conftest.py and tests/knxproj_builder.py (T6 is the only task in its wave allowed to extend them; later tasks only read them or add NEW helper modules)."
      depends_on: [T1, T3, T4, T5]
      done_when: "All QueryService tests pass on synthetic archives; the log book contains only refresh-check and ERROR entries; refresh check semantics unchanged."
    - id: T7
      owner: python-creation-agent
      title: "SDK, CLI (setup group) and MCP exposure"
      description: "sdk/client.py: KnxSessionClient.list_components / describe_component / summarize_topology / trace_group_flow with the parameter names of 003 (session_label, component_selector, selector_kind, detail_level, mutation_name, group_address_selector, communication_object_ref, log_level; strings or enums accepted) delegating to QueryService; export response models from sdk if siblings do. cli/app.py: new typer group 'setup' (app.add_typer(setup_app, name='setup')) with commands list-components (--session, --query, --selector-kind, --detail-level, --mutation, --session-root, --log-level), describe-component (--component required plus the same options), summarize-topology (--session, --detail-level, --mutation, --session-root, --log-level), trace-group-flow (--session, --group-address, --object-ref, --detail-level, --mutation, --session-root, --log-level); all value options are plain strings validated by the core; output via the existing _run helper (one JSON line on stdout, errors as ErrorInfo JSON on stderr, exit code 1). adapters/mcp/server.py: tools list_components, describe_component, summarize_topology, trace_group_flow with argument names as in 003 (str-typed selector_kind and detail_level, optional where specified) using _call/_client; no business rules. Tests: tests/test_sdk.py (SDK-first end-to-end on a synthetic archive session for all four capabilities, all levels), tests/test_adapters.py (delegation with a mocked client: arguments pass through unchanged, option names exact; CLI end-to-end via typer CliRunner incl. error JSON and exit code 1 for SELECTOR_UNRESOLVED and for an invalid --detail-level; MCP tool call for each tool; one test per capability asserting that SDK, CLI and MCP produce the same JSON for the same request; parity expectations include the ANY overlap cases of tests/fixtures/selector_overlap_cases.yaml (same de-duplicated components, same merged sorted match_kinds, same order on all three surfaces) and the error taxonomy table of 003 (same code and details.reason on all three surfaces for SELECTOR_UNRESOLVED, INVALID_REQUEST reasons, INVALID_DETAIL_LEVEL, MUTATION_NOT_FOUND for 'x' and success for 'default')), data-driven in tests/fixtures/surface_cases.yaml; import-direction test stays green (cli/adapters import only sdk and contracts)."
      shared_files: "OWNS sdk/client.py, sdk/__init__.py, cli/app.py, adapters/mcp/server.py, tests/test_sdk.py, tests/test_adapters.py, tests/fixtures/surface_cases.yaml. Reads application API from T6."
      depends_on: [T6]
      done_when: "All four capabilities work on SDK, CLI and MCP with identical JSON; no capability omitted; option and argument names equal the 003 table."
    - id: T8
      owner: python-creation-agent
      title: "Golden-structure tests on the ETS 6 sample"
      description: "tests/test_sample_queries.py and tests/fixtures/sample_query_expectations.yaml. Every test skips with a clear message when tests/lifedata/20261010-EFH-Armbruster.knxproj is absent. Use ONLY counts, ids and structure; never copy personal names (project, building, room or component names) into the repository: names used in selector tests are taken at run time from the imported graph (for example the name of the first placed component), or are generic substrings derived from it (first 3 characters, upper-cased). Assertions: list_components SUMMARY returns 28 matches, 26 with a non-null instance_path (2 unplaced) and component_type distribution equal to the derived component_type_counts of the import (also frozen in the YAML: ACTUATOR 2, CONTROLLER 11, IP_COUPLER_OR_INTERFACE 1, SENSOR 11, UNTYPED 3); every component found exactly by its individual address and by its ETS id (28 of 28) with match_kinds as specified; instance path round trip: for each placed component the INSTANCE_PATH query with its full instance_path returns that component (and only components with that exact path); a trailing-slash location query for every distinct location returns the components placed there; location depth in the sample reaches 4 levels; MEDIUM adds topology and parameters (total parameters over all components equals the 3132 parameter nodes), FULL adds communication objects (total 692) and product / application blocks (12 distinct application_program_id values); SUMMARY is a strict subset of MEDIUM of FULL per component; summarize_topology: areas 2, lines 3, locations 21, components 28, placed 26, sums of line counts and of direct location counts consistent, FULL lists every component once under its line; trace_group_flow: all 695 group addresses addressable by exact address in the project style (ThreeLevel) and in 3-level form, participants total over all group addresses equals the 677 memberships, every participant direction is one of the four values, current_value is unknown everywhere, a partial name of the first named group address (3 characters, run time) returns a set with ambiguous true when more than one matches; full SDK flow create_session -> four queries -> unchanged session-state.yaml; wall time of the four queries per level recorded (printed, bound 30 s per call). The CLI is exercised once on the sample (list-components --detail-level SUMMARY and trace-group-flow)."
      shared_files: "OWNS tests/test_sample_queries.py and tests/fixtures/sample_query_expectations.yaml only; reads everything else."
      depends_on: [T7]
      done_when: "Sample tests pass or skip with a message when the sample is absent; no personal data in the new files (QA greps the new files for the sample's names)."
    - id: T9
      owner: python-creation-agent
      title: "README and implementation notes"
      description: "README.md: document the four query capabilities with CLI examples (knx-agent setup list-components --session S --query 1.1.5, --query 'EG/Wohnzimmer/', describe-component --component P-051B-0_DI-6 --detail-level FULL, summarize-topology --detail-level MEDIUM, trace-group-flow --group-address 5/0/12 / --object-ref ...; use generic placeholder names only), selector kinds and detection, instance path and location terms, the three detail levels (what each adds), ambiguous / empty / SELECTOR_UNRESOLVED behaviour, flag-based direction and its limits (link order not used, no routing, current_value unknown), read-only logging behaviour, MCP tool argument names, test fixtures (YAML files, graph_factory, sample tests skipping when absent). Fill an 'Implementation notes (story 05)' subsection at the end of the 003 section 'Component inspection (story 05)' with interpretations made during implementation (only additions, no change of the documented rules without a spec change request to the architect). Use canonical terms."
      shared_files: "OWNS README.md and the 'Implementation notes (story 05)' subsection of docs/implementation/003-proposed-capability-apis.md (append only)."
      depends_on: [T7]
      done_when: "README sections present and consistent with 003; CLI examples run (verified by T10)."
    - id: T10
      owner: qa-agent
      title: "Executable validation"
      description: "Run uv sync and the full pytest suite via MCP tools. Verify each of the five story success criteria with evidence: (1) list_components selectors and detection incl. ambiguous / empty / unplaced / INVALID_REQUEST on SDK, CLI and MCP; (2) describe_component levels distinct, SELECTOR_UNRESOLVED, derived facts labelled; (3) summarize_topology levels on the sample and on synthetic projects without locations; (4) trace_group_flow selector rules, ambiguous set, flag-only direction, link-order independence, unresolved_links, current_value unknown; (5) refresh check before every call (change the project file between two calls and observe re-import), no own log book entries, ERROR entries for failures, mutation_name -> MUTATION_NOT_FOUND, data-driven fixtures present, sample tests skip when the sample is absent (temporarily rename it or monkeypatch), no personal data in new fixtures or docs (grep for the names in the sample). Cross-check CLI help and option names against the 003 projection table (--session, --session-root, --query, --component, --selector-kind, --detail-level, --group-address, --object-ref, --mutation, --log-level) and MCP argument names; check JSON parity of SDK / CLI / MCP; check import-direction test, terminology (no 'device' as component synonym, 'instance path' and 'location' as defined), purpose fields absent. Record query timings on the sample. Fix coverage gaps with tests."
      shared_files: "May add tests under tests/ in NEW files only (tests/test_qa_story05.py); reports defects for the implementation review gate."
      depends_on: [T8, T9]
      done_when: "All five success criteria have passing evidence; findings are fixed or recorded for the implementation review gate."
  parallelizable_tasks:
    - "T1 first (contracts, error constants, shared error reporting); T2 follows T1 (needs the error helper and SelectorKind)."
    - "After T1 and T2: T3 (domain/component_view.py), T4 (domain/topology_summary.py) and T5 (domain/group_flow.py) touch disjoint source files and disjoint test and fixture files; safe in parallel. None of them edits contracts, graph_index, selectors, conftest or any __init__; a needed change in T1/T2 files is requested from their owner task and made sequentially."
    - "T6 needs T3, T4, T5 (it is the only task allowed to extend tests/conftest.py and tests/knxproj_builder.py in its wave)."
    - "T7 needs T6. After T7: T8 (tests/test_sample_queries.py, sample expectations YAML) and T9 (README.md, 003 notes) touch disjoint files; safe in parallel. T10 last."
    - "NOT safe in parallel: anything editing contracts/query_models.py or domain/graph_index.py after T2 (owners T1 and T2); anything editing sdk/client.py, cli/app.py or adapters/mcp/server.py (T7 only); anything editing tests/conftest.py (T6 only); pyproject.toml is not touched (no new dependency)."
  log_point_matrix:
    - {point: "Query success (list_components, describe_component, summarize_topology, trace_group_flow)", capability: "the called capability", level: none, written_when: "never; read-only, no log book entry of its own at INFO, DEBUG or FULL"}
    - {point: "Refresh check, unchanged", capability: "the called capability", level: DEBUG, written_when: "before the query; log entry only, state and graph not rewritten; its id is the envelope log_book_entry_id"}
    - {point: "Refresh check, changed, automatic re-import done", capability: "the called capability", level: INFO, written_when: "before the query; after graph and state write; details as in the story 04 table"}
    - {point: "Import started and each import warning during an automatic re-import", capability: "the called capability", level: DEBUG, written_when: "as in the story 04 table"}
    - {point: "Any failure (SELECTOR_UNRESOLVED, INVALID_REQUEST with details.reason, INVALID_DETAIL_LEVEL, MUTATION_NOT_FOUND, PROJECT_FILE_UNREADABLE, PROJECT_PARSE_ERROR incl. GRAPH_FILE_INVALID, SESSION_NOT_FOUND, any unexpected exception)", capability: "the called capability", level: ERROR, written_when: "always, whatever log_level; to Python logger 'knx_agent' and, if the session folder exists, to the log book; SESSION_NOT_FOUND and INVALID_LOG_LEVEL before a session exists go to the Python logger only"}
  prerequisite_artifacts:
    - "docs/implementation/003-proposed-capability-apis.md (section 'Component inspection (story 05)'; capabilities 6-9; C3, C4, C6, C7; story 03 and story 04 sections)"
    - "docs/architecture/001-knx-investigation-platform.md section 3"
    - "docs/methodology/02-terminology-dictionary.md (rows Location and Instance path added 2026-10-24; read only for this plan)"
    - "development/backlog/active/05-component-inspection-capabilities.yaml"
    - "tests/lifedata/20261010-EFH-Armbruster.knxproj (read-only study done at planning: 21 spaces with up to 4 levels, 26 of 28 components placed, one component without a name, two duplicate component names, all communication objects have exactly one link, 12 objects with unresolved flags, no '/' in names; use counts, ids and structure only)"
    - "src/knx_agent (stories 02 to 04), tests/conftest.py, tests/knxproj_builder.py"
