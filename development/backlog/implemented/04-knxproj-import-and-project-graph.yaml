      - "development/backlog/implemented/03-session-service-and-project-refresh.yaml"
  guidelines:
    - "Support ETS 6 Professional projects only; do not add handling for other ETS versions unless the user decides otherwise."
    - "The runtime parser is our own; xknxproject (GPL-2.0, repository LICENSE is MIT) is a dev-group cross-check only."
    - "Canonical terms (docs/methodology/02-terminology-dictionary.md): component (device only inside ETS XML element names such as DeviceInstance), project graph, source fact, derived fact, component typing, KNX system setup, session root, work-directory. ETS id means the Id attribute of ETS XML elements."
    - "Source facts and derived facts stay separate in the model, the persisted graph and every output."
    - "Do not implement list_components, describe_component, summarize_topology or trace_group_flow here; do not implement purpose annotation (todo 14) or bus traces (todo 05)."
    - "Layering cli/adapters -> sdk -> application -> domain stays; graph model in domain, parser and derivation in application (infrastructure-style modules), no environment variables."
    - "Parsing must be defensive: untrusted archive (zip bomb limits, path traversal never extracts files to disk, XML entity expansion disabled)."
    - "Data-driven YAML fixtures and synthetic .knxproj archives for fast tests; sample-based tests skip when the file is absent; README documents the fixtures and the sample."
    - "Record lxml (and any other new dependency) in the license record (todo 12)."
    - "Decision owner: architect-planning-agent decides impl-a vs impl-b (by measuring both on the sample) and impl-d (default if undecided: JSON file project-graph.json, written atomically) at planning and records each decision with options and rationale in docs/implementation/003 (project import section) and in the task plan."
    - "Definitions for tests: compression ratio = uncompressed size divided by compressed size of ONE zip entry; required parts = the project folder's project.xml and 0.xml (failure = PROJECT_PARSE_ERROR); optional parts = manufacturer catalog and application program XMLs, knx_master.xml, UserFiles, AddinData and BinaryData (failure = warning, and facts derived from them, for example datapoint types, are reported as limitation notes). Golden counts for the sample are stored as a user-editable fixture tests/fixtures/sample_project_counts.yaml; the measured import time and peak memory are recorded in the docs/implementation/003 project import section."
    - "Terminology: 'capability' = a catalogue entry of docs/implementation/003; 'operation' is not used as a synonym. 'fingerprint' = SHA-256 of the .knxproj file bytes (field project_import.fingerprint); 'content hash' is not used. 'Project graph' is the only term for the normalized model. 'work-directory' is the dictionary term. The dev-time cross-check tool is called xknxproject everywhere. Todo paths are accepted follow-up ids per the Shipped-Asset Alignment rule (concrete todo id) and convert to story ids when backlog stories are created."
