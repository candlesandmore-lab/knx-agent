schema_version: 1
story:
  id: 4
  title: "Import .knxproj into a normalized project graph and integrate it into session creation and refresh"
  state: implemented
  created_on: "2026-10-24"
  last_updated_on: "2026-10-24"
  source_todo:
    - "development/todos/04-knxproj-import-and-setup-inspection.md"
  actor: "End user (domain expert investigating an ETS 6 Professional KNX installation)"
  goal: "Parse an ETS 6 Professional .knxproj file with an own parser into a normalized project graph with stable IDs, provenance, import warnings and component typing, keeping source facts separate from derived facts, persist it in the session work-directory, and use it in create_session, reimport_system_definition and describe_session (richer project_import_summary, real changes and invalidated_references, fingerprint-based refresh check). The query capabilities summarize_topology, list_components, describe_component and trace_group_flow are a later story (story B of todo 04) and are not part of this one."
  success_criteria:
    - "An own parser (lxml or ElementTree; no runtime dependency on xknxproject) imports tests/lifedata/20261010-EFH-Armbruster.knxproj (ETS 6 Professional, ToolVersion 6.1.5686.0, schema namespace http://knx.org/xml/project/22) into a project graph covering installation, areas, lines, components, communication objects, group addresses, memberships, parameters, scenes (when present), and topology/spaces. Each node has a stable ID, provenance and, for components, a component type; source facts and derived facts are stored and exposed separately. Large application program XMLs (up to 50 MB) are read by streaming (iterparse) and only for application programs referenced by components; the import of the sample takes at most 30 seconds as target (measured and recorded in the implementation notes) and a test asserts a bound of 120 seconds; peak memory is measured once and documented, not asserted."
    - "Re-importing the same .knxproj yields identical stable IDs (ETS Id attributes such as P-051B-0_DI-6 where present, a deterministic fallback from the structural path otherwise). A golden-count regression test and a dev-time-only cross-check against xknxproject (GPL-2.0; dev dependency group only, never a runtime dependency, no code copied; golden counts as the fallback if install or license is a problem) compare component, group address and communication object counts and addresses for the sample."
    - "create_session, reimport_system_definition and describe_session on SDK, CLI and MCP use the real import: the graph is persisted in the work-directory; project_import_summary reports real counts; import warnings (code, message, location = zip entry or XML element id) are surfaced as limitation_notes and counted in the summary; reimport_system_definition returns real changes (components, group addresses added/removed/changed) and invalidated_references; no new capability, CLI command or MCP tool is added."
    - "project_import.fingerprint becomes a real content hash of the .knxproj and the refresh check uses it in addition to path, mtime and size, so a content change that keeps mtime and size is detected (closes the story 03 limitation). Password-protected (encrypted) and non-ETS-6 projects (other namespace or ToolVersion major not 6) fail with PROJECT_PARSE_ERROR naming the reason in details; a malformed project.xml or 0.xml fails with PROJECT_PARSE_ERROR; a malformed optional part (for example one unreadable catalog XML) lets the import continue with a warning. The parser defends against hostile archives: it never extracts files to disk and fails with PROJECT_PARSE_ERROR (reason in details) when an archive exceeds 5000 entries, 256 MiB for one entry, 1 GiB total uncompressed size, or a compression ratio of 200 for one entry, and when a required part (project.xml or 0.xml) contains a DTD, external entity, entity expansion or a non-UTF-8 encoding (XML parsers are configured with entity resolution, network access and huge trees disabled). The same content in an optional part (manufacturer catalog, application program XML, knx_master.xml) does NOT fail the import: that part is skipped, never parsed or partially used, and a warning OPTIONAL_PART_UNREADABLE (reason XML_DTD_FORBIDDEN, XML_ENTITY_FORBIDDEN or XML_ENCODING_UNSUPPORTED) is reported (user decision 2026-10-24). Tests cover the zip limits, an entity-expansion file and a DTD in 0.xml (PROJECT_PARSE_ERROR) and in an optional part (warning, import continues, part not used)."
    - "Component typing is stored as a derived fact (classified from product/application reference and communication object datapoint types), never as a source fact; purpose annotation is out of scope (todo 14). Pytest uses data-driven YAML fixtures plus small synthetic .knxproj archives built in tmp_path for fast tests, and sample-based tests that skip with a clear message when tests/lifedata/20261010-EFH-Armbruster.knxproj is absent."
  architecture_options:
    - id: arch-a
      label: "Layered importer, graph model and derivation (chosen)"
      description: "A parser layer reads the .knxproj zip and XML into a normalized graph (domain model); a derivation layer computes derived facts (component typing, memberships indexes); the session service persists and loads the graph. The query layer is a later story."
      trade_offs: "Keeps source and derived facts separate and is easy to test; needs an explicit graph schema. CHOSEN (internal structure, decision 2026-10-24)."
    - id: arch-b
      label: "Single-pass importer producing flat tables"
      description: "The parser emits flat per-entity records with foreign keys."
      trade_offs: "Simpler, but topology traversal is harder and the source/derived separation is weaker. NOT chosen."
  implementation_options:
    - id: impl-a
      label: "lxml parser with iterparse for large files"
      description: "lxml with namespace http://knx.org/xml/project/22 and iterparse/XPath for the big application program XMLs."
      trade_offs: "Fast, XPath, streaming; adds a native BSD-3-Clause dependency (formal license record in todo 12; the license is noted in README.md in this story). Preferred; the architect measures both options on the sample at planning and records the final choice."
    - id: impl-b
      label: "xml.etree.ElementTree (stdlib) with iterparse"
      description: "No extra dependency."
      trade_offs: "No new dependency, but slower and fewer features on 50 MB files; chosen instead of lxml only if its measured import time on the sample meets the 30 second target."
    - id: impl-c
      label: "Stable IDs from ETS Id attributes with structural-path fallback (chosen)"
      description: "Use the ETS Id attribute where present and a deterministic fallback otherwise."
      trade_offs: "IDs are stable across re-imports of the same file; fallback IDs change if the structure changes. CHOSEN (internal)."
    - id: impl-d
      label: "Graph persistence as YAML or JSON in the work-directory"
      description: "A serialised graph file (for example project-graph.json) next to session-state.yaml, written atomically."
      trade_offs: "Simple and inspectable; format and size decided at planning (the sample graph is small compared to the 7.5 MB archive)."
  repository_context:
    branch: story/04-knxproj-import-and-project-graph
    base_commit: 6275bd0
  current_implementation:
    notes: "Stories 02 and 03 are implemented (development/backlog/implemented): src/knx_agent with KnxSessionClient, SessionService, ProjectRefreshGuard, application/knxproj_guard.py (zip validity check only), session-state.yaml with project_import (fingerprint null, placeholder project_import_summary with a limitation note), the KNX session log book, ERROR logging via Python logging, session root. Sample facts (tests/lifedata/20261010-EFH-Armbruster.knxproj, 7.5 MB, 82 zip entries): project folder P-051B with project.xml and 0.xml (28 DeviceInstance, 695 GroupAddress, 692 ComObjectInstanceRef, 3132 ParameterInstanceRef, 21 Space, 2 Area, 3 Line, 96 Node), manufacturer catalog folders M-0083, M-0008, M-01A0 with application program XMLs (largest 50 MB), knx_master.xml with datapoint types; ProjectTrace elements in project.xml are ETS change history, not bus traces. User decisions (2026-10-24): ETS 6 Professional only; own parser; xknxproject only as test cross-check; the sample file is committed to git."
    implementation_notes:
      - "T1 benchmark (scripts/benchmark_knxproj_parse.py, 3 cold runs, stdlib ElementTree iterparse): median 0.94 s (0.951 / 0.921 / 0.940), peak RSS 31.6 to 32.5 MiB; the 50 MB program takes 0.574 s. Decision: impl-b (stdlib) stands, lxml not needed and not installed. Details in docs/implementation/003 'Measured results'."
      - "Phase B (T9 to T13): application/project_importer.py (import_project, fingerprint, summary; writes nothing) and application/import_support.py (persisted project_import shape, log points, limitation notes); ProjectRefreshGuard compares existence, mtime, size, fingerprint and writes project-graph.json before session-state.yaml; SessionLifecycle.create writes graph, state and log book into the temporary folder; the story 03 placeholders (limitation_note, LIMITATION_NOTE, inspect_project) are removed and the story 03 tests run on valid ETS 6 archives built by tests/knxproj_builder.py. Sample end to end (create_session): median 1.18 s (target 30 s, bound 120 s), peak RSS about 83 MiB, project-graph.json 3.2 MB (indent stays 1); impl-b stands. xknxproject cross-check passes (addresses equal; object counts equal per component on objects with memberships). Full interpretations in docs/implementation/003 'Implementation notes (T9 to T13)'."
    relevant_files:
      - "docs/architecture/001-knx-investigation-platform.md"
      - "docs/implementation/003-proposed-capability-apis.md"
      - "src/knx_agent/application/knxproj_guard.py"
      - "src/knx_agent/application/project_refresh_guard.py"
