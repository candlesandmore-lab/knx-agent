    implementation: "No code files change in this story. The catalogue is a design doc artifact. Updated docs will ground future instructed-agent and skill files in later todos. Solution surface classification: top_level_runtime: instructed; subagent_topology: instructed_agent_only (rationale: documentation-only story, no coded sub-agent needed). Phase owners: story drafting - story-telling-agent; planning - architect-planning-agent; implementation (doc authoring, performed in the planning phase) - architect-planning-agent; review - review-validation-agent; qa - qa-agent."
