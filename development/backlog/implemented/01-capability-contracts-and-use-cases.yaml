  development_cycle:
    steps:
      - "Read and cross-reference docs/methodology/001-use-cases-raw.md, docs/implementation/001, 002, and 003 to inventory all existing capability names, their coverage, and inconsistencies."
      - "Compile the canonical capability list from the resolved decisions (create_session, reimport_system_definition, list_environment_inputs, trace_group_flow, load_bus_trace, read_session_log_book, inject_user_action, set_environment_value, answer_activity_question, list_mutations, fetch_component_details, describe_component, select_setup, describe_session, list_components, summarize_topology, resolve_user_action_candidates, create_mutation, set_parameter_override — 19 capabilities total) and confirm no capability from the use cases is unaccounted for; verify that the six surviving capabilities added from docs/implementation/003 (describe_session, list_components, summarize_topology, resolve_user_action_candidates, create_mutation, set_parameter_override) do not conflict with any existing entry or resolved decision, and record any conflicts as open questions. Note: infer_environment_from_trace is merged into load_bus_trace and must not appear as a separate catalogue entry."
      - "Draft all per-capability entries in docs/implementation/003 (name, purpose, request, response with evidence and limitations, errors, CLI/SDK/MCP projection with session_label, use-case trace link); remove the duplicate second content block."
      - "Add catalogue-wide conventions section to 003 preamble: selector syntax (display name and instance path with partial-name matching; individual address and ETS id must be exact); ambiguous-query semantics (returns a set); detail levels SUMMARY/MEDIUM/FULL; log-level model (INFO/DEBUG/FULL, chosen per call or MCP startup arg, default INFO — confirmed decision); persistent current/now system state per setup; active-setup default with optional per-call mutation_name override; freeze note referencing development/todos/13-fixtures-and-end-to-end-validation.md."
