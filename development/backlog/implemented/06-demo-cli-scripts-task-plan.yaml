# Task plan for story 06 (demo CLI scripts and guide). Keys of docs/schemas/implementation-task-plan.template.yaml.
# Planned by architect-planning-agent on 2026-10-24. Scripts, tests and docs are written by python-creation-agent;
# this plan contains no demo or product code.

story_task_plan:
  story: "development/backlog/active/06-demo-cli-scripts.yaml"
  branch: story/06-demo-cli-scripts
  base_commit: fcc9e27

  planning_decisions:
    impact_analysis_wording: "The story's impact_analysis 'implementation: updated' denotes the repository's OWN files (demo/, tests, .gitignore, README.md, todo files), NOT docs/implementation. The decision 'docs/implementation: no change' below and 'implementation: updated' in the story therefore do not contradict each other."
    definitions:
      demo_rule: "The standing rule (canonical name 'demo rule'): once a todo or story is implemented, it adds examples for its new actions/features to ./demo (scripts, expectation entries, README text) and keeps the existing demo scripts working. It is stated once in the demo/README.md maintenance section; the todo files carry the one-line form."
      family_name: "The family name of the sample project owner, written 'armbruster' in the pytest check. The only allowed occurrence anywhere under demo/ is as part of the exact sample file name 20261010-EFH-Armbruster.knxproj; the test removes that exact string and then searches case-insensitively. Defined once here and in the pytest/README maintenance text; other places refer to it as 'the family name'."
      todos_12_13_excluded: "Todos 12 (dependency/license governance) and 13 (fixtures and end-to-end validation) add no user-facing actions or features, so the demo rule line is not added to them."
      terms: "Use only existing dictionary terms. 'session root' = the folder holding all sessions (README, scripts, messages). 'session folder' = the directory of ONE session (the former 'work-directory'). Never use 'session root' for a single session's directory and never 'session folder' for the collection. cleanup.sh messages, README and tests follow this; wherever the plan text below says 'session folder' it means one session's directory."
    architecture: "No change (decision recorded). The demo adds no layer, boundary or data contract; it only calls the existing CLI adapter from outside the package. docs/architecture is unchanged."
    implementation_spec: "No change to docs/implementation (decision recorded). The CLI contract needed by the scripts is already specified in 'Component inspection (story 05)' (Surface projections, Error taxonomy, Selector grammar, trace_group_flow) and 'Session service realisation (story 03)'. No gap found; the task plan below names the real JSON paths instead."
    cli_gap_check: "No gap. Every call of the confirmed inventory is possible with the current CLI: session create has --log-level and --session-root; every command prints one JSON document on stdout; every failure prints the Python ERROR log line and then ErrorInfo JSON as the LAST stderr line and exits 1; list-components accepts a location query with trailing '/'; detail levels are case-insensitive; trace-group-flow takes --group-address (address or partial name) or --object-ref."
    interpretations_to_confirm_at_review:
      - "07-errors.sh exits 0 when all three failing calls ended with exit code 1 and the documented error code; it exits 1 when a call unexpectedly succeeded or gave another code. The 'non-zero exit' of the story is the exit code of the CLI call, printed on the RESULT line (exit=1), asserted by the pytest."
      - "Scripts 02..07 print a hint and fail (exit 1) when the session demo-house does not exist (SESSION_NOT_FOUND on their first call), except 07 which only expects that code for the non-existent label. 01-create-session.sh is idempotent: SESSION_LABEL_EXISTS is reported as a note and counts as success."
      - "cleanup.sh gets an optional second argument --dry-run (prints what would be removed, or the refusal) so the refusal of dangerous paths (/, repository root) is testable without any risk."
      - "Terms: 'generic list-components query' replaces 'ANY query' in scripts and README titles. The README may state that the selector kind defaults to ANY, because ANY is the real --selector-kind default."

  solution_surface: instructed_agent_only
  top_level_runtime: instructed
  subagent_topology: []   # no coded sub-agent; scripts and tests built by python-creation-agent
  phase_owners:
    story_drafting: story-telling-agent
    architecture_spec_task_plan: architect-planning-agent
    implementation: python-creation-agent
    review: review-validation-agent
    validation: qa-agent
  invocation_surfaces:
    sdk:
      status: omitted
      rationale: "Demo scope is the CLI only; the SDK is unchanged. demo/README.md mentions the SDK and MCP surfaces in one paragraph. No shared core Python layer is generated by this story."
    cli:
      status: generated
      rationale: "Demonstrated only (existing CLI from stories 02-05, unchanged by this story)."
    mcp:
      status: omitted
      rationale: "Demo scope is the CLI only; the MCP server is unchanged; mentioned in demo/README.md. Follow-up: development/todos/10-cli-and-mcp-adapters.md."
  log_point_matrix: not applicable   # no new product code; the scripts only call the existing CLI, whose log points are unchanged
  parallel_safety: "Sequential. The tasks are small and share files (lib.sh is used by every script, expectations YAML by the pytest). The pytest itself runs the scripts in file order against ONE temporary session root (01 creates the session that 02-07 use), so do not parametrize them for parallel workers (no pytest-xdist grouping across scripts)."

  # ----- Verified facts about the CLI and the sample (probed 2026-10-24 with a temporary session root) -----
  verified_cli_facts:
    invocation: "uv run knx-agent <group> <command> ... from the repository root (module knx_agent.cli does not run directly)."
    stdout_stderr_exit:
      success: "exit 0; one JSON line on stdout; stderr holds at most the INFO/DEBUG log lines of the stderr handler (create at INFO prints 1 line)."
      failure: "exit 1; stdout empty; stderr = 2 lines: the Python ERROR log line, then ErrorInfo JSON {code, message, details} as the LAST line."
    sample_facts:
      components: 28   # 26 placed, 2 unplaced
      placed_components: 26
      named_components: 27
      areas: 2
      lines: 3
      locations: 21
      communication_objects: 692
      group_addresses: 695
      group_addresses_with_name_seen_via_components: 260
      warning_total: 26
      components_with_instance_path_and_linked_objects: 24
      example_instance_path_depth: "5 segments (4 location levels + the component); its location query lists 9 components and is ambiguous=true"
      name_partial_4_chars_example: "7 matches"
      most_frequent_group_address_name_word: "appears in 90 names; trace-group-flow with it returns a set (134 group addresses, ambiguous=true)"
      unknown_but_valid_group_address: "31/7/255 -> SELECTOR_UNRESOLVED with details.selector_kind GROUP_ADDRESS, details.address_raw 65535"
      note: "Counts are for orientation only; the pytest expectations assert minimums and structure, golden counts stay in tests/fixtures/sample_project_counts.yaml."

  real_json_paths:   # d = the parsed stdout JSON; these are the paths lib.sh and the pytest parse
    session_create:
      session_label: "d['session_label']"
      work_directory: "d['work_directory']"
      component_count: "d['project_import_summary']['node_counts']['component']"
      group_address_count: "d['project_import_summary']['node_counts']['group_address']"
      communication_object_count: "d['project_import_summary']['node_counts']['communication_object']"
      warning_total: "d['project_import_summary']['warning_total']"
      group_address_style: "d['project_import_summary']['group_address_style']"
      log_book_entry_id: "d['envelope']['log_book_entry_id']"
    session_describe:
      session_label: "d['session_label']"
      last_status: "d['project_refresh']['last_status']"
      reimport_count: "d['project_refresh']['reimport_count']"
      component_count: "d['project_import']['project_import_summary']['node_counts']['component']"
      active_setup: "d['active_setup']"
      other_keys: "work_directory, source_project_absolute_path, setups[], trace_artifacts, log_book_references, envelope"
    session_reimport:
      status: "d['project_refresh_status']   # UNCHANGED for the untouched sample"
      changes: "d['changes']   # list, empty"
      invalidated_references: "d['invalidated_references']   # list, empty"
      summary: "d['project_import_summary']"
    list_components:
      count_and_flags: "d['match_count'], d['ambiguous']"
      component_list: "d['matches']   # list of component views"
      name: "d['matches'][i]['identity']['name']   # null for an unnamed component (1 of 28)"
      individual_address: "d['matches'][i]['identity']['individual_address']   # e.g. '1.1.5' form"
      ets_id: "d['matches'][i]['identity']['ets_id']   # 'P-xxxx-0_DI-n' form"
      instance_path: "d['matches'][i]['identity']['instance_path']   # null when unplaced; segments joined by '/'"
      other_instance_paths: "d['matches'][i]['identity']['other_instance_paths']"
      component_type: "d['matches'][i]['derived']['component_type']"
      match_kinds: "d['matches'][i]['match_kinds']   # present ONLY when a selector was given (absent in a broad listing)"
      medium_adds: "topology{area,line,location_path}, component_parameters[]"
      full_adds: "group_addresses[{ets_id,address,name,datapoint_type}], communication_objects[], product, application, engineering_metadata"
      communication_object_fields: "communication_objects[j]: ets_id ('<component id>/co/<ref id>'), ref_id, object_number, label, flags{read,write,communication,transmit,update,read_on_init}, datapoint_types[], definition_resolved, group_addresses[{ets_id,address,name,datapoint_type,link_order}]"
      object_ref_value: "d['matches'][i]['communication_objects'][j]['ets_id']   # the --object-ref value (FULL only)"
      group_address_value: "d['matches'][i]['communication_objects'][j]['group_addresses'][k]['address']   # e.g. '0/1/5' (FULL only)"
      group_address_name: "...['group_addresses'][k]['name']   # may be null"
      envelope: "d['envelope']['limitation_notes'], d['envelope']['detail_level'], d['envelope']['log_book_entry_id']"
    describe_component:
      count_and_flags: "d['match_count'], d['ambiguous']"
      component_list: "d['components']   # same view shapes as list_components matches"
    summarize_topology:
      counts: "d['topology_summary']['counts']['areas'|'lines'|'locations']"
      locations_by_type: "d['topology_summary']['locations_by_type']"
      component_counts: "d['component_counts']['total'|'placed'|'unplaced'|'by_component_type']"
      medium_adds: "d['topology_summary']['areas'], ['locations'] (path, depth, component_count, component_count_total), ['unplaced_component_count']"
      full_adds: "components lists under every line and location"
    trace_group_flow:
      count_and_flags: "d['match_count'], d['ambiguous']"
      group_address: "d['group_addresses'][i]['group_address']['address'|'name'|'ets_id']"
      participants: "d['group_addresses'][i]['participants'][p]['component'] {ets_id,name,individual_address}, ['direction'] (SENDER|RECEIVER|SENDER_RECEIVER|UNDETERMINED)"
      propagation: "d['group_addresses'][i]['propagation_path'] {scope, senders[], receivers[]}"
      unresolved_links: "d['group_addresses'][i]['unresolved_links']   # list"
      current_value: "d['group_addresses'][i]['current_value']   # 'unknown'"
      medium_adds: "participants[].instance_path, component_type, communication_object{ets_id,object_number,label,datapoint_types}, roles"
    error_info: "last stderr line parsed as JSON: e['code'], e['message'], e['details']"
    errors_of_inventory:
      session_not_found: "SESSION_NOT_FOUND details.session_label"
      describe_unknown_selector: "SELECTOR_UNRESOLVED details.selector, details.selector_kind 'ANY', details.evaluated_kinds ['NAME']"
      flow_unknown_group_address: "SELECTOR_UNRESOLVED details.selector_kind 'GROUP_ADDRESS', details.evaluated_kinds ['ADDRESS'], details.address_raw"

  prerequisite_artifacts:
    - "development/backlog/active/06-demo-cli-scripts.yaml (reviewed story)"
    - "src/knx_agent/cli/app.py (existing CLI; unchanged)"
    - "tests/lifedata/20261010-EFH-Armbruster.knxproj (sample; scripts and pytest are specific to it)"
    - "docs/implementation/003-proposed-capability-apis.md sections 'Component inspection (story 05)' and 'Session service realisation (story 03)'"
    - "tests/conftest.py (load_fixture helper) and tests/fixtures (YAML data-driven convention)"

  ordered_tasks:
    - id: T1
      title: "demo/lib.sh: shared helpers"
      owner: python-creation-agent
      depends_on: []
      files: ["demo/lib.sh"]
      design:
        general: "Sourced, never executed. Plain bash (macOS bash 3.2 compatible: no associative arrays, no mapfile). No environment variables are read or exported (shell variables only). Use `set -u` in scripts; NEVER `set -e` (an error example or a failing call must not stop the tour). A header comment explains the contract for maintainers."
        repository_root: "REPO_ROOT=\"$(cd \"$(dirname \"${BASH_SOURCE[0]}\")/..\" && pwd -P)\" resolved from the location of lib.sh, so the scripts work from any current directory; then `cd \"$REPO_ROOT\"`."
        init: "demo_init \"$@\" is called first by each script: sets REPO_ROOT, SAMPLE=tests/lifedata/20261010-EFH-Armbruster.knxproj (relative, the only place the sample file name is written), SESSION_LABEL=demo-house, SESSION_ROOT. SESSION_ROOT = first argument if non-empty, else demo/.sessions. Because the script has already changed into REPO_ROOT, a relative argument resolves against the repository root; an absolute argument is used as given. The sample must exist, otherwise print a clear message and exit 2."
        header_helpers: "demo_header <number> <title> <purpose> (banner with script name); demo_step <text> (short sub-heading); demo_note <text>."
        command_echo_and_run: "demo_run <call-id> <cli arguments...>: prints `$ knx-agent <arguments> --session-root <SESSION_ROOT>` (the command exactly as the user could type it, the root shown so it is reproducible), runs `uv run knx-agent <arguments> --session-root \"$SESSION_ROOT\"`, captures stdout to a temp file and stderr to a second temp file (mktemp, removed by a trap in demo_init), stores LAST_ID, LAST_RC, LAST_OUT, LAST_ERR. Never exits on a non-zero code. The tour calls never pass --session-root themselves; demo_run appends it."
        output_display: "demo_show [max_lines=40]: pretty-prints the captured stdout JSON (python json indent 2 through `uv run python -c`) and truncates to max_lines with the note `... N more lines (the full JSON is long; run the command to see all of it)`. On a failure demo_show_error prints the last stderr line (the ErrorInfo JSON) pretty-printed and states the exit code. Success stderr (log lines) is printed under the label `log output (stderr)` when not empty."
        json_extraction: "demo_json <python expression on d> reads LAST_OUT: `uv run python -c 'import json,sys; d=json.load(open(sys.argv[1])); print(EXPR)' \"$LAST_OUT\"`. Expressions are our own constants (listed under real_json_paths). demo_error_json <expr on e> does the same for the last line of LAST_ERR (e = ErrorInfo)."
        example_derivation: "demo_pick_example: one call `list-components --detail-level FULL` (broad listing; output not shown, only the command; about 1.25 MB, 0.04 s) then ONE python process reading LAST_OUT prints eight tab-separated values read with `IFS=$'\\t' read -r` into EX_NAME_PART, EX_ADDRESS, EX_ETS_ID, EX_INSTANCE_PATH, EX_LOCATION_QUERY, EX_GROUP_ADDRESS, EX_OBJECT_REF, EX_NAME_WORD. Selection rule (deterministic, first in component order): the first match c with c['identity']['instance_path'] not null AND some communication object o with o['group_addresses'] non-empty. EX_NAME_PART = first 4 characters of c['identity']['name'] stripped (fallback: whole name; component without name is skipped by the rule 'named'); EX_ADDRESS = c['identity']['individual_address']; EX_ETS_ID = c['identity']['ets_id']; EX_INSTANCE_PATH = c['identity']['instance_path']; EX_LOCATION_QUERY = '/'.join(instance_path.split('/')[:-1]) + '/' (location part plus trailing slash); EX_OBJECT_REF = o['ets_id'] of that object; EX_GROUP_ADDRESS = o['group_addresses'][0]['address']; EX_NAME_WORD = the most frequent word of at least 3 characters among all names of group addresses seen in all components' communication_objects[].group_addresses[].name (null names skipped, words split on whitespace, ties broken alphabetically), occurring in at least 2 distinct group address names; fallback the first word of the name of EX_GROUP_ADDRESS. If no component qualifies, print `demo: no suitable example found in the sample` and exit 3. Nothing personal is written in any script; names only come from this run-time derivation."
        reporting: "demo_report <call-id-label> [<label>=<python expr on d> ...] prints one machine-readable line `RESULT <id> exit=<rc> <label>=<value> ...` after each call (values: whitespace replaced by '_', booleans as True/False, lists as their length when the expression is `len(...)`). demo_report_error <id> prints `RESULT <id> exit=<rc> error_code=<code>` from the last stderr line (error_code=NONE when the call succeeded). A happy-path call with rc != 0 increments DEMO_FAILED and prints `FAILED: <id>`; demo_expect_error <id> <expected code> increments DEMO_FAILED if rc is 0 or the code differs. demo_finish returns exit 1 when DEMO_FAILED > 0, else 0."
        missing_session_hint: "demo_require_session: runs `session describe` silently; on SESSION_NOT_FOUND prints `Session demo-house not found in <root>. Run demo/01-create-session.sh first (or demo/run-all.sh).` and exits 1."
        no_personal_names: "lib.sh and all scripts contain the sample file name once (SAMPLE) and nothing else of the project owner."
      acceptance: ["bash -n demo/lib.sh passes", "works when called from /tmp as current directory", "no `set -e`, no `export`, no use of $HOME or other environment variables"]

    - id: T2
      title: "demo/01-create-session.sh and 02-describe-and-reimport.sh"
      owner: python-creation-agent
      depends_on: [T1]
      files: ["demo/01-create-session.sh", "demo/02-describe-and-reimport.sh"]
      calls:
        "01-create-session.sh":
          - {id: create, command: "session create --project tests/lifedata/20261010-EFH-Armbruster.knxproj --session-label demo-house", purpose: "Import the project into a new investigation session", report: "session_label=d['session_label'] components=d['project_import_summary']['node_counts']['component'] group_addresses=d['project_import_summary']['node_counts']['group_address'] warnings=d['project_import_summary']['warning_total']", note: "If the label already exists (SESSION_LABEL_EXISTS), print that the session is already there (use cleanup.sh to start afresh), report `RESULT create exit=1 error_code=SESSION_LABEL_EXISTS` and exit 0 (idempotent)."}
        "02-describe-and-reimport.sh":
          - {id: describe, command: "session describe --session demo-house", report: "last_status=d['project_refresh']['last_status'] reimport_count=d['project_refresh']['reimport_count'] components=d['project_import']['project_import_summary']['node_counts']['component']"}
          - {id: describe_debug, command: "session describe --session demo-house --log-level DEBUG", purpose: "Same answer; the stderr log shows more detail (the session lifecycle log lines at DEBUG)", report: "session_label=d['session_label']"}
          - {id: reimport, command: "session reimport --session demo-house", purpose: "Re-read the project file; nothing changed so the status is UNCHANGED", report: "status=d['project_refresh_status'] changes=len(d['changes']) invalidated=len(d['invalidated_references'])"}
      acceptance: ["01 prints the command with --session-root appended", "02 calls demo_require_session first"]

    - id: T3
      title: "demo/03-list-components.sh and 04-describe-component.sh"
      owner: python-creation-agent
      depends_on: [T1]
      files: ["demo/03-list-components.sh", "demo/04-describe-component.sh"]
      calls:
        "03-list-components.sh":
          intro: "demo_pick_example first (explains in a note that the example values are looked up at run time from the project)."
          calls:
            - {id: list_all, command: "setup list-components --session demo-house --detail-level SUMMARY", purpose: "Broad listing of all components (no query)", report: "count=d['match_count'] ambiguous=d['ambiguous']"}
            - {id: by_name, command: "setup list-components --session demo-house --query \"$EX_NAME_PART\" --detail-level SUMMARY", purpose: "Generic query by partial name (case-insensitive)", report: "count=d['match_count'] ambiguous=d['ambiguous']"}
            - {id: by_address, command: "setup list-components --session demo-house --query \"$EX_ADDRESS\" --detail-level SUMMARY", purpose: "Generic query by individual address (exact)", report: "count=d['match_count'] kinds=d['matches'][0]['match_kinds']"}
            - {id: by_ets_id, command: "setup list-components --session demo-house --query \"$EX_ETS_ID\" --detail-level SUMMARY", purpose: "Generic query by ETS id (exact)", report: "count=d['match_count'] kinds=d['matches'][0]['match_kinds']"}
            - {id: by_path_location, command: "setup list-components --session demo-house --query \"$EX_LOCATION_QUERY\" --detail-level SUMMARY", purpose: "Instance path with trailing '/': every component in that location", report: "count=d['match_count'] ambiguous=d['ambiguous']"}
            - {id: level_summary, command: "setup list-components --session demo-house --query \"$EX_LOCATION_QUERY\" --detail-level SUMMARY", report: "count=d['match_count'] has_topology='topology' in d['matches'][0]"}
            - {id: level_medium, command: "... --detail-level MEDIUM", report: "count=d['match_count'] has_topology='topology' in d['matches'][0] has_objects='communication_objects' in d['matches'][0]"}
            - {id: level_full, command: "... --detail-level FULL", report: "count=d['match_count'] has_objects='communication_objects' in d['matches'][0]"}
          note: "by_path_location and level_summary use the same call; implement level_summary by reusing the first (print it as the first of the three level examples to avoid a duplicate run if desired). The three level examples use the location query so the output stays small; demo_show truncates anyway. The word ANY is not used in titles (generic query); the README may mention the default."
        "04-describe-component.sh":
          intro: "demo_pick_example; the report lists below are written space separated for reading only: each label=expression is passed to demo_report as ONE shell argument."
          calls:
           - {id: describe_medium, command: "setup describe-component --session demo-house --component \"$EX_ETS_ID\" --detail-level MEDIUM", purpose: "One component: identity, derived type, topology, parameters", report: "count=d['match_count'] has_topology='topology' in d['components'][0] has_objects='communication_objects' in d['components'][0]"}
           - {id: describe_full, command: "setup describe-component --session demo-house --component \"$EX_ETS_ID\" --detail-level FULL", purpose: "Same component with communication objects, flags and group addresses", report: "count=d['match_count'] objects=len(d['components'][0]['communication_objects']) group_addresses=len(d['components'][0]['group_addresses'])"}
          note: "04 also prints, from the FULL JSON, how to read a communication object (one demo_note with the field names label, flags, group_addresses)."
      acceptance: ["every value derived by demo_pick_example; no literal names, addresses or ids in the scripts"]

    - id: T4
      title: "demo/05-summarize-topology.sh and 06-trace-group-flow.sh"
      owner: python-creation-agent
      depends_on: [T1]
      files: ["demo/05-summarize-topology.sh", "demo/06-trace-group-flow.sh"]
      calls:
        "05-summarize-topology.sh":
          - {id: topology_summary, command: "setup summarize-topology --session demo-house --detail-level SUMMARY", report: "areas=d['topology_summary']['counts']['areas'] lines=d['topology_summary']['counts']['lines'] locations=d['topology_summary']['counts']['locations'] total=d['component_counts']['total'] placed=d['component_counts']['placed']"}
          - {id: topology_medium, command: "... --detail-level MEDIUM", report: "total=d['component_counts']['total'] area_entries=len(d['topology_summary']['areas']) location_entries=len(d['topology_summary']['locations'])"}
          - {id: topology_full, command: "... --detail-level FULL", report: "total=d['component_counts']['total'] location_entries=len(d['topology_summary']['locations'])"}
        "06-trace-group-flow.sh":
          intro: "demo_pick_example"
          calls:
            - {id: flow_by_address, command: "setup trace-group-flow --session demo-house --group-address \"$EX_GROUP_ADDRESS\"", purpose: "One group address by its address; participants with direction labels (MEDIUM default)", report: "count=d['match_count'] ambiguous=d['ambiguous'] participants=len(d['group_addresses'][0]['participants']) value=d['group_addresses'][0]['current_value']"}
            - {id: flow_by_name, command: "setup trace-group-flow --session demo-house --group-address \"$EX_NAME_WORD\" --detail-level SUMMARY", purpose: "Partial group address name: a SET of group addresses (ambiguous=true)", report: "count=d['match_count'] ambiguous=d['ambiguous']"}
            - {id: flow_by_object, command: "setup trace-group-flow --session demo-house --object-ref \"$EX_OBJECT_REF\"", purpose: "Start from one communication object: the group addresses it is linked to", report: "count=d['match_count'] participants=len(d['group_addresses'][0]['participants'])"}
          note: "README explains the direction labels (SENDER, RECEIVER, SENDER_RECEIVER, UNDETERMINED) and that current_value is always unknown."
      acceptance: ["flow_by_name expectation: ambiguous True and count >= 2 on the sample (verified 134)"]

    - id: T5
      title: "demo/07-errors.sh"
      owner: python-creation-agent
      depends_on: [T1]
      files: ["demo/07-errors.sh"]
      calls:
        - {id: err_session_not_found, command: "session describe --session demo-no-such-session", expected_code: SESSION_NOT_FOUND, note: "Exact call (1). Uses the session root; the label cannot exist."}
        - {id: err_selector_unresolved_component, command: "setup describe-component --session demo-house --component no-such-component-xyz", expected_code: SELECTOR_UNRESOLVED, details: "selector, selector_kind ANY, evaluated_kinds [NAME]", note: "Exact call (2): a nonsense name that matches nothing."}
        - {id: err_selector_unresolved_group_address, command: "setup trace-group-flow --session demo-house --group-address 31/7/255", expected_code: SELECTOR_UNRESOLVED, details: "Exact call (3); valid address form that does not exist in the sample; selector_kind GROUP_ADDRESS, address_raw 65535", note: "The literal 31/7/255 is the highest possible 3-level address; if it ever exists in the sample the pytest fails and the script is adapted."}
      behaviour: "Each call is run with demo_run, shows stderr (the ERROR log line and the ErrorInfo JSON) via demo_show_error, prints the exit code, uses demo_expect_error and demo_report_error. A one-line demo_note after each explains code/message/details. Script exit 0 when all three behaved as expected (see interpretations_to_confirm_at_review). Uses demo_require_session only for the second and third call (a missing session must show up as an error of the script, not hide behind SESSION_NOT_FOUND): check via describe first, silently."

    - id: T6
      title: "demo/run-all.sh and demo/cleanup.sh"
      owner: python-creation-agent
      depends_on: [T2, T3, T4, T5]
      files: ["demo/run-all.sh", "demo/cleanup.sh"]
      run_all:
        behaviour: "run-all.sh [session-root]: sources lib.sh (demo_init), runs `bash demo/cleanup.sh \"$SESSION_ROOT\"` first (fresh tour; a REFUSED root aborts the tour with exit 2 before anything runs), then runs 01..07 in numeric order with `bash demo/NN-*.sh \"$SESSION_ROOT\"` (explicit argument, absolute path given to children after resolution). A failing script does NOT stop the tour (collect its exit code); the script exits 0 only if all seven exited 0. Ends with a table `script / exit code` and the line `Tour complete: N of 7 scripts passed`. Does not remove the session at the end (the user can look at it); prints `Clean up with demo/cleanup.sh`."
      cleanup:
        usage: "cleanup.sh [session-root] [--dry-run]. Default root demo/.sessions (relative to the repository root). Resolution: cd to the repository root (as lib.sh), then physical path of the root with `cd -P` (symlinks resolved)."
        exit_codes: "0 = removed, nothing to do (default root absent), or dry run accepted; 2 = REFUSED (nothing deleted, message on stderr starting `cleanup.sh: refused:` with the reason)."
        refused:
          - "R1 empty argument (the empty string) or whitespace only"
          - "R2 the path '/' (after resolving)"
          - "R3 the user's home directory (`cd ~ && pwd -P`) - read with the tilde, no $HOME variable access"
          - "R4 the repository root, or any ancestor of the repository root (REPO_ROOT equals or lies below the candidate)"
          - "R5 the demo folder itself (<repo>/demo) and the tests folder; in general any directory that contains lib.sh or .git"
          - "R6 a path that is not an existing directory (missing path, regular file, device). EXCEPTION: the DEFAULT root demo/.sessions missing is not a refusal - print `Nothing to clean` and exit 0. An explicitly passed root that does not exist IS refused (R6)."
          - "R7 a symbolic link as the final path component (the link target is never followed for deletion)"
          - "R8 a directory that fails the content test below"
        empty_explicit_root: "DECISION: an existing EMPTY explicit directory is accepted (it passes the content test) and is removed, exit 0, message `Removed <path>`. An absent DEFAULT root demo/.sessions = `Nothing to clean`, exit 0 (not a refusal). An absent EXPLICIT root is refused (R6)."
        acceptance_rule: "A directory that survives R1-R8 is deleted only if EITHER its name (basename of the resolved path) ends in `.sessions` (this covers the default demo/.sessions) OR it is an explicitly passed root whose content test passes. Content test (the 'looks like a session root' test): every direct entry of the directory is either a sub-directory containing a file named session-state.yaml (a session work-directory) or a hidden sub-directory named `.*.creating-*` (an interrupted create). An empty directory passes. Any other entry (a regular file, a foreign folder) fails the test, so an arbitrary temp folder with other content is never removed. A name ending in `.sessions` still must not be a symlink (R7) and must satisfy R1-R6, but its content is not tested."
        implementation_notes: "Deletion with `rm -rf -- \"$resolved\"` ONLY after every check passed and the resolved variable is non-empty (guard `[ -n \"$resolved\" ]` immediately before rm). After removal print `Removed <resolved path>`. --dry-run prints `Would remove <path>` (accepted) or the same refusal text, performing no deletion. Messages are plain English."
      acceptance: ["bash -n for both", "run-all.sh from /tmp with an absolute temp root passes on the sample", "cleanup refuses every case R1-R8 (pytest T9)"]

    - id: T7
      title: "demo/README.md"
      owner: python-creation-agent
      depends_on: [T2, T3, T4, T5, T6]
      files: ["demo/README.md"]
      language: "Plain English for a domain expert (KNX / building automation), not a software developer: explain terms the first time (session, session root, component, location, instance path, selector, detail level, group address, communication object, direction). Use canonical terms of docs/methodology/02-terminology-dictionary.md; introduce no new term. Say 'generic query' for list-components without --selector-kind; the README may state that the default selector kind is ANY (automatic recognition) because it is the real default."
      structure:
        - "1 What this demo is (one paragraph; sample project named by file name only; CLI only; scripts are specific to the sample and to this development workspace)"
        - "2 Prerequisites: macOS/Linux shell (bash), uv installed, `uv sync` done in the repository, the sample file present at the stated path; no environment variables needed"
        - "3 Quick start: `demo/run-all.sh`, what you will see, where the session lives (demo/.sessions, git-ignored), optional first argument = session root (relative to the repository root, or absolute), works from any current directory"
        - "4 How to read the output: the command is printed before every call (`$ knx-agent ...`), then the JSON (pretty-printed, long output shortened), the `RESULT` line (machine-readable summary used by the automated test), success = exit 0 with JSON on stdout; failure = exit 1 with nothing on stdout and the error on stderr (an ERROR log line, then the error as JSON: code, message, details)"
        - "5 The tour in order: one subsection per script 01..07 (table or short block per call: command, purpose, what to expect, what to look for in the JSON: field names from real_json_paths). 03: how each query kind is recognised, location query with trailing slash, three detail levels (what is added). 06: direction labels, set result for a partial name, object-ref start, current_value always unknown. 07: the three error codes, what each details field tells"
        - "6 Reading the JSON in detail: a small reference of the fields used (envelope, limitation_notes, match_count, ambiguous, match_kinds, instance_path, communication_objects[].flags, participants[].direction)"
        - "7 Clean up: demo/cleanup.sh [root] [--dry-run], what it removes, what it refuses (plain list R1-R8 summarised: it only removes a session folder collection; it refuses /, your home, the repository, anything that is not an existing plain directory, symbolic links, or folders that do not look like sessions)"
        - "8 Beyond the CLI: the same capabilities exist as Python SDK (KnxSessionClient) and MCP tools (knx-agent-mcp); not part of this demo; pointer to the main README"
        - "9 Maintaining the demo (for developers): the standing 'demo rule' (every new action or feature adds examples here - scripts, expectation entries, README text - and keeps the existing ones working); how to add a script (copy a numbered script, use lib.sh helpers, add the expectation entries to tests/fixtures/demo_script_expectations.yaml, mention it in this README - the pytest enforces it); the interpretation of RESULT lines; do not write personal names (derive at run time); the pytest tests/test_demo_scripts.py is the guard; todos that must follow the rule"
      acceptance: ["mentions every script file name and lib.sh, run-all.sh, cleanup.sh", "contains no occurrence of the family name apart from the sample file name", "all seven actions shown with their command"]

    - id: T8
      title: "Repository wiring: .gitignore, README link, demo rule lines in todos"
      owner: python-creation-agent
      depends_on: []
      files: [".gitignore", "README.md", "development/todos/05-bus-trace-ingestion.md", "development/todos/06-environment-user-action-and-scenario-state.md", "development/todos/07-expectation-engine-and-activity-questions.md", "development/todos/08-mutations-and-logbooks.md", "development/todos/09-component-knowledge-enrichment.md", "development/todos/10-cli-and-mcp-adapters.md", "development/todos/11-agent-layer.md", "development/todos/14-component-purpose-annotation.md"]
      steps:
        - ".gitignore: add the line `demo/.sessions` under the '# KNX agent runtimes' block (next to `.knx-agent/*`)."
        - "README.md: add a short 'Demo' paragraph (after the sample project / Commands area, before 'Test fixtures' or right after the 'Component inspection' Limitations) linking to demo/README.md: 'Hands-on tour of every CLI action on the sample project: [demo/README.md](demo/README.md); run `demo/run-all.sh`.' Also add demo/ and the new test to the existing README tables where fixtures/tests are listed: row `tests/fixtures/demo_script_expectations.yaml | expected exit codes, error codes and key output fields of the demo scripts`, and mention tests/test_demo_scripts.py in 'Sample-based tests and skipping' (skips when the sample is absent)."
        - "Add as the LAST line (own line, after a blank line) of each of the todo files 05, 06, 07, 08, 09, 10, 11, 14 exactly: `Demo rule (todo 16): once implemented, add examples for new actions/features to ./demo (scripts and README) and keep existing demo scripts working.` Not added to 12 and 13. Do not duplicate if present."
      acceptance: ["git check-ignore demo/.sessions succeeds", "grep finds the rule line in exactly the eight todos"]

    - id: T9
      title: "pytest tests/test_demo_scripts.py and tests/fixtures/demo_script_expectations.yaml"
      owner: python-creation-agent
      depends_on: [T2, T3, T4, T5, T6, T7, T8]
      files: ["tests/test_demo_scripts.py", "tests/fixtures/demo_script_expectations.yaml"]
      design:
        skip: "pytestmark = skipif(not SAMPLE.exists(), reason=\"sample project 20261010-EFH-Armbruster.knxproj is absent; demo script tests are skipped\") with SAMPLE = tests/lifedata/<file>. Also skip if bash or uv is not found (shutil.which) with a clear reason. Only the static checks (README, family name, actions, refusal) may run without the sample; they still need no sample, so apply the skip only to the tests that run scripts."
        execution: "A module-scoped fixture creates an ABSOLUTE session root `tmp_path_factory.mktemp('demo') / 'sessions'` (not created in advance: 01 creates it). Each script is run with subprocess.run(['bash', str(DEMO / name), str(root)], cwd=<another tmp dir, proves cwd independence>, capture_output=True, text=True, timeout=300). Scripts run in the file order 01..07 as separate test cases that share the root (ids = script names); the environment is inherited unchanged (no variables set)."
        output_parsing: "Parse lines matching `^RESULT (\\S+) exit=(\\d+)(.*)$`; the rest is split into key=value pairs. Expectations compare strings; a value spec is either a literal (`equals`) or `min: N` (integer >= N)."
        expectations_yaml:
          shape: |
            scripts:
              - script: 01-create-session.sh
                exit_code: 0
                results:
                  - {id: create, exit: 0, fields: {components: {min: 1}, session_label: demo-house}}
              - ... 02 .. 06 happy paths per T2-T4 (fields as in the report lists)
              - script: 07-errors.sh
                exit_code: 0
                results:
                  # exact calls: describe --session demo-no-such-session; describe-component --component no-such-component-xyz; trace-group-flow --group-address 31/7/255
                  - {id: err_session_not_found, exit: 1, error_code: SESSION_NOT_FOUND}
                  - {id: err_selector_unresolved_component, exit: 1, error_code: SELECTOR_UNRESOLVED}
                  - {id: err_selector_unresolved_group_address, exit: 1, error_code: SELECTOR_UNRESOLVED}
            run_all:
              exit_code: 0
              scripts_listed: [all seven]
            actions: ["session create", "session describe", "session reimport", "setup list-components", "setup describe-component", "setup summarize-topology", "setup trace-group-flow"]
            detail_levels_used: [SUMMARY, MEDIUM, FULL]
            family_name: armbruster
            sample_file_name: 20261010-EFH-Armbruster.knxproj
            cleanup_refusals: [list of cases, below]
          sample_specific_minimums: "components min 28 is NOT asserted exactly (golden counts are in sample_project_counts.yaml); use min: 1 and structure flags (has_topology True/False, ambiguous True for flow_by_name, reimport status UNCHANGED, changes 0)."
        test_cases:
          - "test_script[<name>] data-driven: exit code of the script, every expected RESULT line present with expected exit code, fields and error_code; no unexpected 'FAILED:' text in stdout; stderr of the script is empty or only log lines (do not assert)."
          - "test_run_all: separate absolute root; exit 0; stdout contains a header/RESULT for every call id of all seven scripts and the line `Tour complete: 7 of 7`."
          - "test_session_root_default_is_git_ignored: run `git check-ignore -q demo/.sessions` in the repository (skipped if git missing)."
          - "test_readme_mentions_every_script: every demo/*.sh file name (and lib.sh) appears in demo/README.md; the list of scripts is read from the directory so a new script without README text fails."
          - "test_all_seven_actions_appear: each string of `actions` occurs in the concatenated text of demo/*.sh."
          - "test_no_family_name: for each file under demo/ except the .sessions folder, read text, `.replace(sample_file_name, '')`, casefold, assert 'armbruster' not in it (the only allowed occurrence is the exact sample file name string)."
          - "test_no_environment_variables: no script text contains `export ` or `printenv`, and no `$HOME`/`${HOME`  (cleanup uses tilde resolution only). Also `set -e` must not appear in lib.sh or the numbered scripts."
          - "test_todo_demo_rule: the eight todo files end with the exact rule line; todos 12 and 13 do not contain it."
          - "test_cleanup_removes_session_root: create tmp/'x.sessions' with a fake session folder (a directory containing session-state.yaml) -> run cleanup.sh <abs> -> exit 0 and the folder is gone; also a root named 'sessions' (not ending in .sessions) containing only valid session folders is removed (content test)."
          - "test_cleanup_refuses[<case>] data-driven from `cleanup_refusals`; each asserts exit code 2, stderr contains `refused`, and the target still exists. Real destructive risk is avoided: cases that point at '/', the repository root and the demo folder pass `--dry-run` as second argument; the home case runs with the subprocess environment variable HOME set to a throw-away directory (the script resolves tilde against it) and passes that directory; all other cases may run for real inside tmp_path because they are refused. Refusal cases, exactly these twelve (ids in the YAML): (1) empty_string; (2) whitespace_string; (3) filesystem_root '/' with --dry-run; (4) repository_root with --dry-run; (5) repository_parent (parent directory of the repository root) with --dry-run; (6) demo_folder (<repo>/demo) with --dry-run; (7) throwaway_home (HOME env of the subprocess set to a tmp dir, that dir passed); (8) missing_explicit_path; (9) regular_file; (10) symlink_to_sessions_dir (symlink to a valid .sessions dir; the target must survive); (11) plain_directory_with_file ('important' holding a regular file; must survive); (12) foreign_subfolder_directory (directory not ending in .sessions holding a sub-folder without session-state.yaml; must survive). Positive cases: (P1) valid .sessions dir with --dry-run prints `Would remove` and survives; (P2) valid .sessions dir removed, exit 0; (P3) root named 'sessions' holding only session folders removed; (P4) existing empty explicit directory removed, exit 0; (P5) default root absent is not tested against the real repository (would touch demo/.sessions); it is covered by running run-all-less `cleanup.sh` semantics via QA in T10."
        parallel_safety: "Not parallelizable across the script cases (shared session root); different test modules are unaffected."
      acceptance: ["uv run pytest tests/test_demo_scripts.py -rs passes with the sample present", "with the sample file hidden the script tests report the skip reason and static tests still run", "full suite uv run pytest tests stays green"]

    - id: T10
      title: "qa-agent: execute and validate the demo"
      owner: qa-agent
      depends_on: [T9]
      checks:
        - "Run demo/run-all.sh manually from the repository root and from /tmp with an absolute root; confirm exit 0, readable output, the RESULT lines and the three error blocks."
        - "Run each script individually in order and out of order (02 without 01 prints the hint and fails cleanly; 01 twice is idempotent)."
        - "Run demo/cleanup.sh for the default root and with the refusal cases (dry-run for dangerous ones); confirm nothing outside the root is touched."
        - "Run uv run pytest tests/test_demo_scripts.py -rs and the full uv run pytest tests; ruff/lint settings of the repository if configured."
        - "Read demo/README.md as a domain expert: plain English, every call explained, commands copy-paste correct, no personal names (grep -ri armbruster demo shows only the sample file name), links work."
        - "Check bash -n and (if installed) shellcheck on the scripts; macOS bash 3.2 compatibility."
        - "Confirm git status: demo/.sessions not tracked, no session artefacts committed."

  parallelizable_tasks: []   # sequential, see parallel_safety; T8 is independent of T1-T7 but is tiny and may be done first by the same agent

  review_checkpoints:
    - "After this plan: consolidated review gate (plan vs story; interpretations_to_confirm_at_review)."
    - "After T1-T8: review of the scripts (safety of cleanup.sh, no personal data, no environment variables)."
    - "After T9-T10: implementation review gate and final alignment validation (todos carry the rule, README link, .gitignore)."

  completion_conditions:
    - "demo/ contains lib.sh, 01..07 scripts, run-all.sh, cleanup.sh, README.md; scripts are executable (chmod +x recorded in git mode)."
    - "All seven CLI actions are demonstrated; every inventory call of the story is present with the commands above."
    - "uv run pytest tests (full suite) passes; demo tests skip with a clear message when the sample is absent."
    - "demo/README.md complete per T7 including the maintenance section with the demo rule."
    - ".gitignore has demo/.sessions; README.md links to demo/; the eight todos carry the demo rule line, 12 and 13 do not."
    - "No file under demo/ contains the family name except as part of the sample file name."
    - "docs/architecture and docs/implementation unchanged (no-change decisions recorded in this plan)."
