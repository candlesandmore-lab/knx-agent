story_task_plan:
  story: "development/backlog/active/04-knxproj-import-and-project-graph.yaml"
  spec_reference: "docs/implementation/003-proposed-capability-apis.md (section 'Project import and project graph (story 04)', capabilities 1-3, C7); docs/architecture/001-knx-investigation-platform.md section 3; docs/implementation/002-bootstrap-implementation-plan.md (Slice 2 note)"
  decisions:
    arch: "arch-a chosen (layered importer, graph model and derivation)."
    impl_a_vs_impl_b: "Default impl-b (stdlib xml.etree.ElementTree iterparse). Binding rule: T1 benchmarks; switch to impl-a (lxml) ONLY if the measured end-to-end import of the sample exceeds 30 s. Planning pre-measurement (parse-only, stdlib): 1.06 s, peak RSS 27 MiB. lxml was not installable during planning and was not measured."
    impl_c: "ETS Id with composite and structural fallback (spec: Stable ID rules)."
    impl_d: "JSON file project-graph.json in the work-directory, atomic write (default of the story, confirmed)."
    warnings_vs_error_rule: "Import warnings are NOT issues under the story 03 ERROR rule: no ERROR entries for warnings; DEBUG entries per warning, counts in the INFO entry, one Python logging WARNING record per import that has warnings. Failures (PROJECT_PARSE_ERROR, PROJECT_FILE_UNREADABLE) stay ERROR."
    required_vs_optional_parts: "Required: project.xml and 0.xml only. Everything else is optional. OPTIONAL_PART_MISSING = absent from the archive; OPTIONAL_PART_UNREADABLE = present but rejected or malformed, message form 'Optional part skipped (reason: <XML_DTD_FORBIDDEN|XML_ENTITY_FORBIDDEN|XML_ENCODING_UNSUPPORTED|XML_MALFORMED|ENTRY_READ_ERROR>)'. Archive-level guard failures (too many entries, entry or total size, ratio, duplicate names, encrypted, not a zip) stay PROJECT_PARSE_ERROR even when they concern an optional entry (tests: oversize, over-ratio and encrypted OPTIONAL entries -> PROJECT_PARSE_ERROR)."
    terms: "Use exactly: fingerprint (SHA-256 of the file bytes), project refresh check (compares existence, mtime, size, fingerprint; re-imports on difference), CHANGED / UNCHANGED (status values of project_refresh.last_status and reimport project_refresh_status). Definitions in 003 section 'Fingerprint and refresh check'. The terminology dictionary is not edited."
    dtd_entity_encoding_in_xml: "User decision 2026-10-24: a DTD, entity declaration/expansion or non-UTF-8 encoding in a REQUIRED part (project.xml, 0.xml) fails the import with PROJECT_PARSE_ERROR (details.reason XML_DTD_FORBIDDEN / XML_ENTITY_FORBIDDEN / XML_ENCODING_UNSUPPORTED). In an OPTIONAL part (catalog, Hardware.xml, application programs, knx_master.xml) the part is skipped and the import continues with warning OPTIONAL_PART_UNREADABLE (same reason in the message); the part is never parsed or partially used."
  existing_code_note: "src/knx_agent exists from stories 02 and 03: application/knxproj_guard.py (stat_project, inspect_project = zip validity only), project_refresh_guard.py (_apply_import, check, force, mtime/size compare), session_lifecycle.py (atomic create via temp sibling folder), session_service.py (_envelope uses the story 03 limitation_note), domain/session_state.py (ProjectImportSummary with limitation_note, ProjectImport.fingerprint: None), contracts/models.py (ProjectImportSummary, ReimportSystemDefinitionResponse.changes/invalidated_references as list[dict], DescribeSessionResponse). Story 03 tests build NON-ETS synthetic zips; they must be migrated to the new valid-ETS-6 builder (T4, T10). Sessions created by story 03 are not migrated."
  ordered_tasks:
    - id: T1
      owner: python-creation-agent
      title: "Benchmark: ElementTree streaming read of the sample (impl-a vs impl-b decision)"
      description: "FIRST task. Write a standalone dev script (for example scripts/benchmark_knxproj_parse.py, not part of the shipped package, no product code) that opens tests/lifedata/20261010-EFH-Armbruster.knxproj with zipfile (never extracting), hashes it with hashlib.sha256 in 1 MiB chunks, and stream-parses project.xml, 0.xml, knx_master.xml and the application program XMLs referenced by the 28 DeviceInstance elements (12 of the 13 in the archive) with xml.etree.ElementTree.iterparse, clearing translation/dynamic subtrees and keeping only referenced ComObject/ComObjectRef/Parameter/ParameterRef attributes. Report wall time per file and in total, peak RSS (resource.getrusage) in MiB. Run through the MCP python_execution tool (cold process, 3 runs, report the median). Apply the binding rule in docs/implementation/003 ('impl-a vs impl-b: benchmark rule'): impl-b stands unless the measured time exceeds 30 s; if it does, install lxml via the MCP tool, measure the same workload, and record that impl-a is adopted (add the follow-up edit to T5/T9: lxml parser configured resolve_entities=False, no_network=True, huge_tree=False, load_dtd=False). Record the numbers and the decision under 'Measured results' in docs/implementation/003 (section 'Project import and project graph (story 04)') and in the story file implementation notes. Planning pre-measurement for comparison: 1.06 s, 27 MiB."
      depends_on: []
      done_when: "Median time, per-file times, peak RSS and the impl-a/impl-b decision are recorded in docs/implementation/003; the decision follows the binding rule."
    - id: T2
      owner: python-creation-agent
      title: "Domain graph model and contracts"
      description: "domain/project_graph.py: Pydantic v2 models for the common node fields (id, kind, id_origin, source_part, source_locator, fact_origin) and the eleven node kinds with the field lists in 003; relations membership and placed_in; ProjectGraph with source_facts (nodes, relations), derived_facts (component_typing, membership_index, derived_counts), warnings, fingerprint and graph_schema_version; pure ID helpers implementing the Stable ID rules 1-6 (ETS_ID, ETS_COMPOSITE, STRUCTURAL_FALLBACK, collision suffix ~2, deterministic ordering by (kind, id)); group address text formatter for ThreeLevel/TwoLevel/Free. No I/O, no framework imports beyond pydantic. contracts: ImportWarning(code, message, location), extended ProjectImportSummary (fields in 003), ProjectChange, InvalidatedReference, ProjectImportInfo, DescribeSessionResponse.project_import, ReimportSystemDefinitionResponse typed changes/invalidated_references; warning code constants. No new error codes (PROJECT_PARSE_ERROR gets details.reason values; constants for the reason strings). contracts imports nothing from knx_agent. Keep domain.session_state ProjectImport/ProjectImportSummary in sync (T8 finalises the persisted shape)."
      depends_on: [T1]
      done_when: "Models validate and serialise to the documented field names; ID helper tests (data-driven YAML fixture tests/fixtures/stable_id_cases.yaml) cover ETS Id, composite, structural fallback, collision suffix and deterministic ordering; import-direction test passes."
    - id: T3
      owner: python-creation-agent
      title: "Dev dependency group: xknxproject"
      description: "In pyproject.toml add xknxproject to the dev dependency group ONLY (GPL-2.0, dev-time cross-check, never a runtime dependency, never imported by src/). Refresh uv.lock through the MCP execution tool (uv lock/sync). If the install or the license is a problem, leave the group unchanged, record why in README.md (T13) and rely on golden counts (the cross-check test skips if not installed). Do not add lxml (unless T1 adopted impl-a, then add it as a runtime dependency here)."
      depends_on: [T1]
      done_when: "uv sync succeeds; xknxproject is importable in the dev environment or the fallback is recorded; no runtime dependency on xknxproject (pyproject dependencies list unchanged except a T1-driven lxml)."
    - id: T4
      owner: python-creation-agent
      title: "Synthetic .knxproj builder and fixture scaffolding (tests only)"
      description: "tests/knxproj_builder.py (helper imported like conftest helpers): builds small VALID ETS 6 archives in tmp_path with zipfile: project folder P-0001 with project.xml and 0.xml (namespace http://knx.org/xml/project/22, ToolVersion 6.1.x), parameterised by a Python/YAML description (areas, lines, segments with medium type, components with product/hardware2program refs, group addresses and ranges, communication object instance refs with Links, parameter instance refs, spaces with DeviceInstanceRef, optional scene element) plus optional manufacturer folder M-0001 with Hardware.xml and application program XML, and knx_master.xml. Options to produce every error and warning case: not a zip, empty file, encrypted entry (flag bit), too many entries, oversize entry, ratio breach, duplicate entry, missing project.xml, missing 0.xml, malformed project.xml, wrong namespace, ToolVersion major 5 or missing, DOCTYPE, ENTITY declaration (billion-laughs file), UTF-16 document (each of the three in 0.xml -> PROJECT_PARSE_ERROR with the matching reason, and each in an optional part: a DTD in the application program XML of one component, a DTD in Hardware.xml and a DTD in knx_master.xml -> import succeeds, warning OPTIONAL_PART_UNREADABLE with reason XML_DTD_FORBIDDEN, the part's definitions are NOT in the graph (objects unresolved) and the other components are unaffected), malformed optional catalog XML, missing application program, unresolved link, second installation file. Fixture YAML files under tests/fixtures: import_error_cases.yaml (case -> expected details.reason), import_warning_cases.yaml (case -> expected warning code and location), typing_rule_cases.yaml (component description -> expected type, rule_id, basis; MUST cover every rule and boundary listed in 003 'Rule coverage by fixture': CT0 by each key and beating CT1, CT1 by has_ip_config and by MT-5, rule order CT1>CT2>CT3, CT3 with zero and with unresolved objects, CT4 for R>0/T=0, T>0/R=0, R=T=0, R=2T, R=2T-1, T=2R, T=2R-1, the tie R=T, a both-flags object counted in both, unresolved flags counted in neither), application_program_resolution_cases.yaml (archive description -> expected application_program_id, referenced/read program lists and warnings: path P1 via Hardware2Program, fallback P2 with Hardware.xml absent, Hardware.xml unreadable, no matching Hardware2Program, P1/P2 disagreement -> P1 wins + APPLICATION_PROGRAM_REFERENCE_MISMATCH, parameter-reference prefix disagreement, ProductRefId alone not resolving a program, an unreferenced program present in the archive that must NOT be opened, missing program -> APPLICATION_PROGRAM_MISSING), reimport_change_cases.yaml (before/after descriptions -> expected changes and invalidated_references), zip_limit_cases.yaml (lowered ArchiveLimits per case). conftest helpers extended; the story 03 helper that builds a non-ETS zip is kept only for the NOT_A_ZIP/guard-level cases and the other story 03 tests move to the valid builder in T10. Tests of the builder itself (it produces archives zipfile and ElementTree can read)."
      depends_on: [T1]
      done_when: "Builder produces a valid minimal archive and each error/warning variant; builder tests pass; fixtures are data-driven YAML."
    - id: T5
      owner: python-creation-agent
      title: "Hostile-archive guard and safe XML reading"
      description: "application/knxproj_archive.py: ArchiveLimits dataclass (defaults: 5000 entries, 256 MiB per entry = 268435456, 1 GiB total = 1073741824, ratio 200 = uncompressed/compressed per entry, strictly greater breaches; stored entry with compress_size 0 and file_size > 0 breaches), constants asserted by a test. Header checks over the central directory first (entry count, per-entry size, total size, ratio, duplicate names, encrypted flag) with details.reason values from 003; project folder discovery (single top-level P-<hex> folder with project.xml) and required/optional part helpers; open entries only with ZipFile.open (never extract; entry names never used as paths). Safe XML reading: a byte-stream guard that scans for <!DOCTYPE and <!ENTITY across chunk boundaries and rejects non-UTF-8 documents (UTF-16 BOM, encoding declaration other than UTF-8), feeding xml.etree.ElementTree iterparse/XMLPullParser (or lxml with the safe options if T1 adopted impl-a); expose a function that yields iterparse events from a zip entry and one that returns a small tree for required parts. Archive-limit and required-part failures raise KnxAgentError(PROJECT_PARSE_ERROR) with details.reason, path, entry, limit, actual. The XML guard takes a 'required' flag: for required parts (project.xml, 0.xml) DTD/entity/encoding rejection raises PROJECT_PARSE_ERROR (XML_DTD_FORBIDDEN, XML_ENTITY_FORBIDDEN, XML_ENCODING_UNSUPPORTED); for optional parts it returns a rejected-part result (reason) BEFORE any parser sees the document, so the caller (T6) adds OPTIONAL_PART_UNREADABLE, skips the part and continues; no partial content of a rejected part is used. Direct pytest coverage with the T4 builder and zip_limit_cases.yaml (lowered limits; one real test of the ratio limit with a highly compressible entry, one of 5001 entries, DOCTYPE and ENTITY expansion file and UTF-16 file in a required part -> PROJECT_PARSE_ERROR, the same three in an optional part -> rejected-part result, split-across-chunk DOCTYPE)."
      depends_on: [T2, T4]
      done_when: "Every limit and every XML rejection has a passing test with the expected details.reason; default constants test passes; no file is ever written outside tmp_path (test asserts the working directory listing is unchanged)."
    - id: T6
      owner: python-creation-agent
      title: "ETS 6 parser: project.xml, 0.xml, catalog resolution, streaming of application programs"
      description: "application/knxproj_parser.py (own parser, no xknxproject). Steps: validate root KNX element (namespace http://knx.org/xml/project/22 else UNSUPPORTED_NAMESPACE; ToolVersion major 6 else UNSUPPORTED_TOOL_VERSION; project element Id else NOT_ETS_PROJECT); read project.xml (ProjectInformation fields, installation list); read 0.xml (Topology Area/Line/Segment/DeviceInstance; Locations Space tree with DeviceInstanceRef; GroupAddresses/GroupRanges; DeviceInstance ComObjectInstanceRefs with Links, ParameterInstanceRefs, IPConfig presence); ignore other <n>.xml with ADDITIONAL_INSTALLATION_IGNORED; build installation, area, line, space, component, group_range, group_address, communication_object, parameter and scene nodes plus membership and placed_in relations with provenance (source_part, source_locator, fact_origin) and IDs from T2. Catalog resolution: implement exactly the normative 'Referenced application program' definition of 003 (P1: DeviceInstance/@Hardware2ProgramRefId -> manufacturer folder -> Hardware.xml Hardware2Program -> ApplicationProgramRef/@RefId -> entry <M>/<id>.xml; ProductRefId only for product text/order number; P2 textual fallback only when P1 is unusable; P1 wins on disagreement with warning APPLICATION_PROGRAM_REFERENCE_MISMATCH) with Hardware.xml per manufacturer folder and knx_master.xml (datapoint type ids) as optional parts; open ONLY application programs referenced by components in that sense (a test records which zip entries are opened and asserts an unreferenced program is never opened), each streamed with iterparse keeping only definitions whose ids are referenced by the instances (parameter definition id = ref_id up to the last _R-), clearing subtrees (Translation, TranslationUnit, when, choose, Dynamic) as they end so memory is bounded; application_program nodes with source_loaded. Emit every warning code of the 003 contract with location per rule (zip entry or entry#ets-id); malformed optional part or an optional part rejected by the XML guard (DTD, entity, encoding) -> OPTIONAL_PART_UNREADABLE with the reason in the message, part skipped and never used, import continues; malformed required part -> PROJECT_PARSE_ERROR REQUIRED_PART_MALFORMED. Returns graph source_facts and warnings (derivation is T7). Deterministic ordering. Direct pytest coverage per node kind and per warning code with the T4 builder and import_error_cases.yaml / import_warning_cases.yaml."
      depends_on: [T2, T4, T5]
      done_when: "Synthetic archives produce the expected nodes, relations, IDs and warnings; error cases produce PROJECT_PARSE_ERROR with the expected details.reason; two imports of the same synthetic archive give identical source_facts."
    - id: T7
      owner: python-creation-agent
      title: "Derivation (component typing, indexes) and graph diff"
      description: "domain/derivation.py (pure): derive component_typing with rules evaluated strictly in the order CT0_OVERRIDE (override table is a function parameter `overrides`, EMPTY by default, test-injected only, never read from file/environment/project, never persisted), CT1_IP, CT2_COUPLER, CT3_NO_OBJECTS, CT4_DIRECTION exactly as in 003 incl. basis fields and the precise CT4 comparison (R = write flag Enabled count, T = transmit flag Enabled count; R>=2T ACTUATOR checked before T>=2R SENSOR, tie R=T>0 is CONTROLLER, unresolved flags count in neither); membership_index (group_address_to_communication_objects, component_to_group_addresses, sorted) and derived_counts. Never write derived values into source nodes. domain/graph_diff.py (pure): diff(old_graph, new_graph) -> changes (entity component|group_address, change added|removed|changed, id, label, details with changed_fields/old/new, sorted) and invalidated_references(old_graph, new_graph, scenario_state, mutations) per 003 (component_id, component_ids, group_address_id keys; reference_kind scenario_state|mutation_delta; reason COMPONENT_REMOVED|GROUP_ADDRESS_REMOVED; owner = mutation name or list index text). Direct pytest coverage with typing_rule_cases.yaml and reimport_change_cases.yaml (graphs described in YAML, no archives needed)."
      depends_on: [T2, T4]
      done_when: "All typing rules and change/invalidated-reference cases pass; derivation is idempotent and does not mutate its input."
    - id: T8
      owner: python-creation-agent
      title: "Graph persistence and session-state shape"
      description: "application/graph_store.py: write_graph(work_directory, graph) -> JSON project-graph.json (UTF-8, sorted keys, 1-space indent; compact if the measured sample file exceeds 20 MB), atomic via temporary file in the same folder and os.replace; read_graph(work_directory) -> ProjectGraph (validated; missing/corrupt file -> a clear internal result that the guard treats as CHANGED, not an unhandled exception). No timestamps in the file so unchanged projects give byte-identical output. domain/session_state.py: ProjectImport gets fingerprint: str | None, graph_file, graph_schema_version, warnings (list of ImportWarning, first 200) and the new ProjectImportSummary; remove LIMITATION_NOTE and the limitation_note field. session_paths read/write_state keep atomic writes and key order. Direct pytest coverage (round trip lossless, byte-identical rewrite, failed write leaves previous file intact, corrupt file handling)."
      depends_on: [T2, T4]
      done_when: "Round trip and atomicity tests pass; session-state.yaml round trip with the new project_import passes."
    - id: T9
      owner: python-creation-agent
      title: "Importer orchestration and fingerprint"
      description: "application/project_importer.py: import_project(path, limits=ArchiveLimits(), overrides=()) -> ImportResult(graph, fingerprint, mtime_ns, size, summary, warnings, duration_s). Order: stat (PROJECT_FILE_UNREADABLE) -> SHA-256 fingerprint of the file bytes in 1 MiB chunks -> archive guard (T5) -> parser (T6) -> derivation (T7) -> summary (node_counts for all kinds incl. zeros, relation_counts, component_type_counts, application_programs referenced/read/unreadable, warning_total/warning_counts, ets_tool_version, schema_namespace, created_by, project_id, project_name, group_address_style, graph_file, graph_schema_version); stat again afterwards and abort with PROJECT_FILE_UNREADABLE details.reason CHANGED_DURING_IMPORT if mtime or size changed. Nothing is written by the importer. Keep knxproj_guard.stat_project; inspect_project is replaced by the importer (remove dead code). Tests: data-driven import_error_cases/import_warning_cases end to end, fingerprint value equals hashlib of the file, same archive twice gives identical graph and summary, CHANGED_DURING_IMPORT via monkeypatch."
      depends_on: [T5, T6, T7, T8]
      done_when: "Importer returns correct summaries for synthetic archives; all PROJECT_PARSE_ERROR reasons reachable and tested; fingerprint tests pass."
    - id: T10
      owner: python-creation-agent
      title: "SessionService, SessionLifecycle and ProjectRefreshGuard integration"
      description: "ProjectRefreshGuard.check: existence -> mtime -> size (any difference = CHANGED, re-import) -> fingerprint (hash the file; stored null, differing, or missing graph file = CHANGED; all equal = no write, state byte-identical, DEBUG log entry as before). force: always re-import, status CHANGED when mtime, size, fingerprint or graph file differ, else UNCHANGED; imported_at always rewritten; compute changes and invalidated_references via graph_diff from the old graph (read through graph_store; a missing old graph gives empty changes) and the session-state scenario_state/mutations. Write order: parse first, then project-graph.json, then session-state.yaml; failure writes nothing. SessionLifecycle.create: run the importer, write project-graph.json and session-state.yaml into the temporary sibling folder before the atomic rename (a failed import leaves no folder; error order unchanged: label, readable, import/parse, exists). SessionService: _envelope limitation_notes = import warnings formatted '[<code>] <message> (<location>)', max 50 plus the '<n> more import warnings not listed...' entry; describe_session returns project_import {imported_at, fingerprint, graph_file absolute, project_import_summary} from session-state.yaml only (no graph read); reimport returns real changes and invalidated_references (each invalidated reference also a limitation note). Log points per the log_point_matrix below. Replace story 03 placeholders (LIMITATION_NOTE, empty changes). Update existing story 03 tests and fixtures (describe_session_cases.yaml, refresh_change_cases.yaml with a new content-change-same-mtime-and-size case, create_session_error_cases.yaml incl. PROJECT_PARSE_ERROR reasons, log_level_cases.yaml) to the new behaviour and to the T4 builder; add tests: content change keeping mtime and size is detected (set os.utime back), unchanged check idempotent and byte-identical, graph file deleted -> next check re-imports, reimport changes (component and group address added/removed/changed), invalidated_references from injected scenario_state/mutations entries, warnings surfaced as limitation_notes and counted, ERROR entries only for failures (not for warnings), failed re-import keeps previous state and graph."
      depends_on: [T9]
      done_when: "create/describe/reimport behave per success criteria 3 and 4 at core level; all migrated story 03 tests pass."
    - id: T11
      owner: python-creation-agent
      title: "SDK, CLI and MCP surface checks"
      description: "No new capability, CLI command or MCP tool. Verify KnxSessionClient, the typer CLI (session create/describe/reimport) and the MCP tools return the extended models unchanged (project_import_summary with real counts, project_import in describe, typed changes/invalidated_references, limitation_notes with warnings); CLI errors print the Python logging ERROR line to stderr then ErrorInfo JSON with details.reason for PROJECT_PARSE_ERROR (exit code 1). Update tests/test_adapters.py, tests/test_sdk.py, tests/test_contracts.py (mock/delegation tests plus one CLI end-to-end and one MCP tool call with a synthetic archive per surface). Adapters import only sdk and contracts; import-direction test stays green."
      depends_on: [T10]
      done_when: "All three surfaces expose the real import results; adapter delegation tests and import-direction test pass."
    - id: T12
      owner: python-creation-agent
      title: "Sample-based tests, golden counts, xknxproject cross-check, performance"
      description: "tests/fixtures/sample_project_counts.yaml (user-editable golden counts; initial values from 003: installation 1, area 2, line 3, space 21, component 28, communication_object 692, group_address 695, group_range 60, parameter 3132, scene 0, application_program 12, membership 677, ets_tool_version 6.1.5686.0, namespace http://knx.org/xml/project/22, archive_entry_count 82, project_id P-051B; component_type_counts recorded after the first run and then frozen). tests/test_sample_project.py: every test skips with a clear message when tests/lifedata/20261010-EFH-Armbruster.knxproj is absent. Tests: golden counts match; application_programs referenced 12 / read 12 of the 13 program XMLs in the archive and, with zipfile.ZipFile.open instrumented, M-0083/M-0083_A-003B-24-3717.xml is never opened and has no application_program node; stable IDs identical across two imports and graph JSON byte-identical; example IDs such as P-051B-0_DI-6 present; every component has a typing derived fact and no source node carries a type; sample imports with the expected warnings (or none) recorded in the fixture; time bound assertion <= 120 s (target 30 s measured and printed, recorded in docs/implementation/003 'Measured results'); peak memory measured once with resource.getrusage in a script/run and documented (not asserted); full create_session/describe_session/reimport_system_definition flow on the sample via the SDK incl. fingerprint equals hashlib of the file. tests/test_xknxproject_crosscheck.py: pytest.importorskip('xknxproject'); parse the sample with xknxproject (dev-only import, no code copied) and compare component count and individual addresses, group address count and addresses, communication object count per component with our graph; skips with a message if xknxproject is not installed. Skip-aware CI note in README (T13)."
      depends_on: [T10, T3]
      done_when: "Sample tests pass (or skip with message when the sample is absent); cross-check passes or skips; measured time and memory are recorded in docs/implementation/003."
    - id: T13
      owner: python-creation-agent
      title: "README, dependency and license notes, spec measurements"
      description: "README.md: document project import (ETS 6 only, own parser), project-graph.json and its relation to session-state.yaml, fingerprint refresh rule (hash on every check that finds mtime and size equal, cost for the 7.5 MB sample), limits (5000 entries, 256 MiB per entry, 1 GiB total, ratio 200, DTD/entity rejection), warning codes and where they appear (limitation_notes, summary counts), that ETS signatures are not verified, that story 03 sessions must be recreated, the test fixtures (YAML files, synthetic builder, sample tests skipping when absent, golden counts file), and how to run the xknxproject cross-check. Dependency/license notes: no new runtime dependency (or lxml BSD-3-Clause if T1 adopted impl-a); xknxproject GPL-2.0 dev-only; both flagged for the license record in development/todos/12-dependency-license-governance.md (do not edit that todo unless it lacks the note). Fill the 'Measured results' lines in docs/implementation/003 with T1/T12 numbers if still TBD. No wording from the replaced-alias table (device, object as component synonyms) in new text."
      depends_on: [T10]
      done_when: "README sections present and consistent with 003; Measured results lines are no longer TBD once T12 has run."
    - id: T14
      owner: qa-agent
      title: "Executable validation"
      description: "Run uv sync and the full pytest suite via MCP tools. Verify each story success criterion with evidence: (1) sample import counts, IDs, provenance, source/derived separation, import time <= 30 s target and 120 s bound, persisted project-graph.json; (2) stable IDs on re-import, golden counts, cross-check pass/skip; (3) create/reimport/describe on SDK, CLI and MCP with real counts, warnings as limitation_notes, real changes and invalidated_references, no new CLI command or MCP tool; (4) fingerprint closes the story 03 limitation (content change with unchanged mtime and size detected), encrypted and non-ETS-6 projects, malformed required part, malformed optional part with warning, hostile archive limits and entity expansion; (5) component typing only as derived fact, fixtures data-driven, sample tests skip when the file is absent (temporarily rename it or run with a monkeypatched path). Re-check the impl-a/impl-b rule against the full-import timing. Check logging: warnings produce DEBUG entries and one Python WARNING record but no ERROR entries; failures produce ERROR entries. Check no runtime import of xknxproject (grep src/), no extraction to disk (working directory unchanged after importing hostile fixtures), terminology (project graph, source fact, derived fact, component typing, fingerprint, work-directory; no 'content hash'), and fill coverage gaps."
      depends_on: [T11, T12, T13]
      done_when: "All five story success criteria have passing evidence; QA findings are fixed or recorded for the implementation review gate."
  parallelizable_tasks:
    - "After T1: T2, T3 and T4 touch disjoint files (src domain/contracts; pyproject.toml and uv.lock; tests builder and fixtures) and are safe in parallel."
    - "After T2 and T4: T5 (application/knxproj_archive.py), T7 (domain/derivation.py, graph_diff.py) and T8 (application/graph_store.py, domain/session_state.py) are safe in parallel; T8 and T2 both touch domain/session_state.py and contracts only through T2's earlier completion, so T8 starts after T2 is merged."
    - "T6 needs T5 (archive and safe-XML API); T9 needs T5, T6, T7, T8; T10 needs T9; T11 follows T10."
    - "After T10: T11 (tests/test_adapters.py, test_sdk.py, test_contracts.py), T12 (tests/test_sample_project.py, tests/test_xknxproject_crosscheck.py, tests/fixtures/sample_project_counts.yaml) and T13 (README.md, docs/implementation/003 measurement lines) are safe in parallel; T12 needs T3 for the cross-check dependency; T14 last."
    - "NOT safe in parallel: T1 first (decision), T2 before T5/T7/T8, anything editing tests/conftest.py (T4 owns it), anything editing pyproject.toml or uv.lock (T3 owns it, plus T1 only if impl-a is adopted)."
  log_point_matrix:
    - {point: "Import started", capability: "calling capability (create_session, reimport_system_definition, any session-scoped call that re-imports)", level: DEBUG, written_when: "before parsing; details project path and size"}
    - {point: "Session created (import finished)", capability: create_session, level: INFO, written_when: "after atomic rename; details gain fingerprint, node_counts, warning_total, duration_s"}
