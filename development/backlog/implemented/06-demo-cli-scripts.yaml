schema_version: 1
story:
  id: 6
  title: "Demo CLI scripts and guide for the ETS 6 sample project"
  state: implemented
  created_on: "2026-10-24"
  last_updated_on: "2026-10-24"
  source_todo:
    - "development/todos/16-demo-cli-scripts.md"
  actor: "End user (domain expert evaluating the current knx-agent implementation)"
  goal: "Give the end user a hands-on, scripted way to see what the current knx-agent CLI can do on the committed ETS 6 Professional sample tests/lifedata/20261010-EFH-Armbruster.knxproj: from creating a session to every available CLI call, with a README that guides through them, and keep the demo alive as the product grows."
  success_criteria:
    - "demo/ contains exactly this user-confirmed (2026-10-24) inventory of numbered, runnable bash scripts calling the real knx-agent CLI for ALL seven implemented actions: 01-create-session.sh (session create, label demo-house); 02-describe-and-reimport.sh (session describe plain and with --log-level DEBUG; session reimport, UNCHANGED); 03-list-components.sh (list-components with ANY query by partial name, by individual address, by ETS id, by instance path with trailing '/', and with detail levels SUMMARY, MEDIUM, FULL); 04-describe-component.sh (describe-component of one component at MEDIUM and at FULL); 05-summarize-topology.sh (SUMMARY, MEDIUM, FULL); 06-trace-group-flow.sh (by group address, by partial group address name returning a set, by --object-ref); 07-errors.sh (three failing calls that print the error and must not stop the tour: session describe of a non-existent session -> SESSION_NOT_FOUND, describe-component with an unknown selector -> SELECTOR_UNRESOLVED, trace-group-flow with an unknown group address -> SELECTOR_UNRESOLVED; codes per the error taxonomy in docs/implementation/003 section 'Component inspection (story 05)' and 'Session service realisation (story 03)'); plus lib.sh, run-all.sh, cleanup.sh and README.md."
    - "The scripts are specific to the sample but derive selectors (component names, individual addresses, ETS ids, instance paths, group addresses) from CLI output at run time instead of hard-coding personal names; they use the real CLI via `uv run knx-agent ...` from the repository root whatever the current directory is, take an optional session-root argument as first argument (default demo/.sessions, git-ignored; the scripts change into the repository root first, so a relative root resolves against the repository root, and an absolute path is used as given), use no environment variables, create the session label demo-house, and demo/cleanup.sh removes the session root (and refuses to delete anything outside a path ending in .sessions or a given root argument that is not a directory); demo/run-all.sh runs the whole tour."
    - "demo/README.md guides the end user step by step in logical order from session creation to the setup actions: prerequisites, how to run each script (or all), for every call the command, its purpose and what to expect, how to read the JSON and the errors, how to clean up, and a maintenance section stating the standing rule that every new action or feature must add demo examples and keep existing ones working."
    - "A pytest (skipped with a clear message when tests/lifedata/20261010-EFH-Armbruster.knxproj is absent) runs every demo script against the sample, passing an absolute temporary session root as the first argument, and asserts exit code 0 for the happy-path scripts and the documented error code and non-zero exit for the error examples, plus key fields of the output (not byte-exact snapshots), and checks that demo/README.md mentions every demo script, that all seven CLI actions appear in the scripts, and that no file under demo/ contains the sample owner's family name (the only allowed occurrence is the sample file name)."
    - "The demo rule (canonical name 'demo rule') is added as one line to the todo files 05, 06, 07, 08, 09, 10, 11 and 14 ('Demo rule (todo 16): once implemented, add examples for new actions/features to ./demo (scripts and README) and keep existing demo scripts working.'); todos 12 (license governance) and 13 (fixtures and validation) add no user-facing actions and are excluded; later todos that add CLI actions follow the demo rule through the demo README maintenance section."
  architecture_options:
    - id: arch-a
      label: "Thin bash wrappers around the real CLI with shared helper (chosen)"
      description: "demo/lib.sh holds the repository-root resolution, the session-root argument handling, the printing helpers and the run-time selector derivation; numbered scripts source it; the pytest runs the scripts via subprocess."
      trade_offs: "Transparent for the end user and no new product code; macOS/Linux shell only, which matches the development workspace. CHOSEN (decision 2026-10-24)."
    - id: arch-b
      label: "Python scripts invoking the CLI via subprocess"
      description: "Demo scripts as Python files."
      trade_offs: "More portable but less readable as 'what to type'. NOT chosen."
  implementation_options:
    - id: impl-a
      label: "Run-time selector derivation with `uv run python -c` JSON parsing (chosen)"
      description: "lib.sh calls the CLI, parses the JSON output with a one-line python through uv run (no jq dependency) to pick the first matching component, a placed component's instance path and a group address."
      trade_offs: "No extra tool needed; slightly more shell code. CHOSEN."
    - id: impl-b
      label: "jq for JSON parsing"
      description: "Use jq."
      trade_offs: "Adds an external prerequisite. NOT chosen."
  repository_context:
    branch: story/06-demo-cli-scripts
    base_commit: fcc9e27
  current_implementation:
    notes: "main (fcc9e27) contains stories 1-5. CLI: knx-agent session create --project <file> --session-label <label> [--session-root <dir>] [--log-level], session describe/reimport --session <label>, setup list-components [--query] [--selector-kind] [--detail-level], describe-component --component, summarize-topology, trace-group-flow (--group-address | --object-ref); JSON on stdout, errors as ErrorInfo JSON on stderr with exit code 1. Sample: tests/lifedata/20261010-EFH-Armbruster.knxproj (28 components, 26 placed in a Building/Floor/Room location tree, 695 group addresses, 692 communication objects). README.md documents the CLI. User decisions (2026-10-24): demo scripts are specific to the sample data and only need to work in this development workspace; real CLI; no environment variables; own git-ignored session root."
    relevant_files:
      - "README.md"
      - "src/knx_agent/cli/app.py"
      - "docs/implementation/003-proposed-capability-apis.md"
      - "tests/lifedata/20261010-EFH-Armbruster.knxproj"
      - "development/todos/16-demo-cli-scripts.md"
    depends_on_stories:
      - "development/backlog/implemented/02-package-skeleton-and-core-api.yaml"
      - "development/backlog/implemented/03-session-service-and-project-refresh.yaml"
      - "development/backlog/implemented/04-knxproj-import-and-project-graph.yaml"
      - "development/backlog/implemented/05-component-inspection-capabilities.yaml"
  guidelines:
    - "Scripts call the real CLI; no mocks; no environment variables; repository-relative paths."
    - "No personal names from the sample in scripts, README or tests: derive values at run time; the sample file name is the only place the family name appears."
    - "The demo session root is demo/.sessions (git-ignored) or the session-root argument; cleanup.sh removes only that folder."
    - "Scripts are specific to the sample and only need to work in this development workspace; the pytest skips when the sample is absent."
    - "Error examples demonstrate the CLI behaviour (ErrorInfo JSON on stderr, exit code 1) and must not stop run-all.sh."
    - "Canonical terms from docs/methodology/02-terminology-dictionary.md (component, instance path, location, session root, selector kind, detail level, direction label); the demo introduces no new term."
    - "Use plain English in the README, aimed at a domain expert, not a software developer."
    - "Deferred follow-up ids are development todo paths (accepted by the Shipped-Asset Alignment rule)."
