  guidelines:
    - "ETS 6 Professional only. Canonical terms (docs/methodology/02-terminology-dictionary.md): component (device only inside ETS XML names), project graph, source fact, derived fact, component typing, session_label, capability = catalogue entry."
    - "Selector rules: name and instance path partial and case-insensitive; individual address and ETS id exact; ambiguous queries return the set; the core never guesses."
    - "No purpose annotation (todo 14), no simulated values (todos 06/07), no line or area routing, no bus traces (todo 05), no mutations (todo 08); purpose_annotation fields are absent until todo 14."
    - "Layering cli/adapters -> sdk -> application -> domain; no environment variables; Python, pytest, YAML validation and git operations only through the MCP tools."
    - "Data-driven YAML fixtures for selectors, detail levels and flows; golden outputs for the sample must not contain more personal data than needed (assert counts, ids and structure rather than copying names where possible)."
    - "Deferred follow-up ids are development todo paths (accepted by the Shipped-Asset Alignment rule); they convert to story ids when backlog stories are created."
