schema_version: 1
story:
  id: 5
  title: "Component inspection capabilities: list, describe, summarize topology and trace group flow"
  state: implemented
  created_on: "2026-10-24"
  last_updated_on: "2026-10-24"
  source_todo:
    - "development/todos/15-component-inspection-capabilities.md"
  actor: "End user (domain expert investigating an ETS 6 Professional KNX installation)"
  goal: "On top of the project graph delivered by story 4, provide the four read-only query capabilities list_components, describe_component, summarize_topology and trace_group_flow of docs/implementation/003-proposed-capability-apis.md (capabilities 6-9) on SDK, CLI and MCP, with component selectors (display name, instance path, individual address, ETS id), the three detail levels SUMMARY / MEDIUM / FULL and direct group address flow, validated against the committed ETS 6 Professional sample."
  success_criteria:
    - "list_components accepts an optional component_selector with optional selector_kind (ANY default, NAME, INSTANCE_PATH, INDIVIDUAL_ADDRESS, ETS_ID) and detail_level (SUMMARY, MEDIUM default, FULL) on SDK (KnxSessionClient.list_components), CLI (knx-agent setup list-components --session ... --query ...) and MCP: display name and instance path match case-insensitively as substrings (instance path = ETS location path Building/Floor/Room plus the component name, separated by '/', typed segments matching consecutive path segments); individual address (1.1.5) and ETS id (P-051B-0_DI-6) match exactly; the kind is auto-detected, ANY returns the union; an ambiguous or partial query returns the full set with ambiguous=true, no match returns an empty set; components not placed in a location (2 of 28 in the sample) have no instance path; an explicit selector_kind that does not fit the value (for example a malformed individual address for INDIVIDUAL_ADDRESS) raises INVALID_REQUEST. Terms (user decision 2026-10-24, to be added to the terminology dictionary): instance path = the full path including the component name (selector and output field instance_path); location = a space of the ETS location tree (Building, Floor, Room, ...)."
    - "describe_component returns the set of matching components (one element when unambiguous, ambiguous flag otherwise) and raises SELECTOR_UNRESOLVED when nothing matches; SUMMARY shows name, individual address, ETS id, component type and instance path; MEDIUM (default) adds topology (area, line) and component parameters with their values; FULL adds communication objects with their group addresses and datapoint types, product and application information, and purpose annotation when present (todo 14); source facts and derived facts (component type) are labelled."
    - "summarize_topology returns the topology summary per capability 8 from the persisted project graph on SDK, CLI and MCP; detail levels (user decision 2026-10-24): SUMMARY = counts of areas, lines, locations, components and the component_type distribution; MEDIUM (default) = SUMMARY plus component counts per area and line and per location (Building, Floor, Room); FULL = MEDIUM plus the component names and individual addresses under each line and location; locations appear only where the project encodes them (limitation note otherwise)."
    - "trace_group_flow takes exactly one of group_address_selector (exact address in the project's address style or 3-level form, or partial group address name, case-insensitive) and communication_object_ref (else INVALID_REQUEST; no match SELECTOR_UNRESOLVED); a partial name that matches several group addresses returns a set with ambiguous=true (one flow entry per match, like list_components), an exact address matches one; it returns per match the group address, its linked communication objects and the components owning them with direction taken from the ETS communication object flags only (Transmit, Write, Read, Update; user decision 2026-10-24), unresolved_links from the import warnings, current_value always unknown (simulation arrives with todos 06/07) and propagation_path limited to these direct participants (no line or area routing). The order of group address links is not used as a sender rule in this story; verifying it against ETS documentation is a deferred item."
    - "All four capabilities run the project refresh check before every call and are read-only (no log book entry of their own besides refresh-check entries, ERROR for failures); mutation_name is accepted and raises MUTATION_NOT_FOUND until mutations exist (todo 08); results carry the C7 envelope with evidence_sources KNXPROJ and limitation_notes; tests use data-driven YAML fixtures (selector, detail level and flow cases), synthetic ETS 6 archives and golden outputs for known selectors on tests/lifedata/20261010-EFH-Armbruster.knxproj (skipped with a message when absent), plus SDK-first, CLI and MCP end-to-end tests."
  architecture_options:
    - id: arch-a
      label: "Query service in the application layer over the loaded project graph (chosen)"
      description: "A QueryService (application layer) loads the persisted project-graph.json once per call through the refresh guard, builds in-memory indexes (by name, location path, individual address, ETS id, group address) and implements the four capabilities; the SDK, CLI and MCP only delegate."
      trade_offs: "Consistent with the layering and the refresh check; indexes are rebuilt on every call (the sample graph is 3.2 MB, so this is cheap) and can be cached later. CHOSEN (internal structure, decision 2026-10-24)."
    - id: arch-b
      label: "Persisted query indexes next to the graph"
      description: "Write indexes at import time."
      trade_offs: "Faster for huge projects but adds a second persisted artifact and invalidation rules. NOT chosen."
  implementation_options:
    - id: impl-a
      label: "Selector matching as a pure domain module with fixtures (chosen)"
      description: "Selector parsing, kind detection and matching live in the domain layer as pure functions tested with YAML fixtures; the application layer wires them to the graph."
      trade_offs: "Easy to test exhaustively; CHOSEN (internal)."
    - id: impl-b
      label: "Detail levels as projection functions over one component view model"
      description: "One component view model holds all fields; SUMMARY/MEDIUM/FULL are projections."
      trade_offs: "Avoids drift between levels; CHOSEN (internal)."
  repository_context:
    branch: story/05-component-inspection-capabilities
    base_commit: 435d281
  current_implementation:
    notes: "Stories 1-4 are implemented and merged into main (435d281). Story 4 delivers the persisted project-graph.json loaded through src/knx_agent/application/graph_store.py into the domain model src/knx_agent/domain/project_graph.py (source facts) with derived facts (component typing, memberships) from domain/derivation.py; SessionService, ProjectRefreshGuard, session-state.yaml, KNX session log book, ERROR logging, contracts/ErrorInfo, KnxSessionClient, typer CLI and MCP adapter exist. Sample facts: 28 components (26 placed in a location tree Building > Floor > Room with up to 4 levels, 2 unplaced), 692 communication objects, 695 group addresses, 677 memberships, 12 application programs; the sample links are single links so the order of links is unverified. User decisions (2026-10-24): instance path is the location path; three distinct detail levels; trace_group_flow follows direct participants only."
    relevant_files:
      - "docs/implementation/003-proposed-capability-apis.md"
      - "docs/architecture/001-knx-investigation-platform.md"
      - "src/knx_agent/domain/project_graph.py"
