story_task_plan:
  ordered_tasks:
    - id: T1
      title: Capture prioritized use cases
      description: Collect the user troubleshooting workflows that should define the first stable capability contracts across SDK, CLI, and MCP.
    - id: T2
      title: Define investigation session model
      description: Capture the session identifier, work-directory, session-state file, lifecycle states, and ownership boundaries for a session anchored by one `.knxproj` input.
    - id: T3
      title: Define normalized KNX project graph
      description: Capture the entities, identifiers, relationships, and provenance required to represent `.knxproj` inputs.
    - id: T4
      title: Build `.knxproj` parser spike
      description: Prove extraction of topology, devices, discovered device typing, group addresses, and communication objects from a sanitized sample project.
    - id: T5
      title: Build KNX bus-trace parser spike
      description: Prove extraction of timestamped telegram observations and decoded address references from a sanitized trace sample.
    - id: T6
      title: Define shared capability contracts
      description: Derive canonical request and response models plus a callable core API from prioritized use cases so CLI, SDK, and MCP can expose the same operations without behavioral drift.
    - id: T7
      title: Package agent layer
      description: Define the instructed prompts or skills that orchestrate the deterministic capability surface with technical, short, crisp, and non-guessing behavior.
    - id: T8
      title: Expose read-only MCP query tools
      description: Implement the first MCP tool set with `mcp` FastMCP for project loading, trace loading, topology inspection, environment updates, user-action resolution, and group-flow tracing from the shared core API.
    - id: T9
      title: Expose deterministic CLI commands
      description: Implement a CLI surface with `typer` for the supported capabilities using the same SDK-facing core API and result models as MCP.
    - id: T10
      title: Expose programmable Python SDK
      description: Implement an SDK surface that exposes the canonical callable core API used by CLI and MCP.
    - id: T11
      title: Add scenario state and event injection
      description: Introduce session-scoped environmental, trace-derived, and user-triggered inputs that can drive simulations.
    - id: T12
      title: Implement minimal expectation simulation
      description: Compute expected participant reactions for a constrained set of event and device patterns.
    - id: T13
      title: Add component enrichment adapter
      description: Fetch and normalize external product details for one representative device family discovered in the project.
    - id: T14
      title: Enforce dependency license policy
      description: Record and verify that selected Python packages use free-to-use licenses compatible with the intended delivery model.
  parallelizable_tasks:
    - T1 should complete before T6 hardens the first stable capability contracts.
    - T2 and T3 should align early because the session model anchors the project graph lifecycle.
    - T4 and T5 can proceed in parallel when sanitized project and trace fixtures are available.
    - T6 can proceed while T4 and T5 are being implemented once the first use cases are agreed.
    - T10 should establish the callable API before T8 and T9 bind CLI and MCP adapters to it.
    - T7 can proceed in parallel with T8, T9, and T10 once the capability contracts are clear.
    - T8 and T9 should proceed from T6 and T10 and share the same capability contracts.
    - T11 can start after T2 and T3 even before vendor enrichment exists.
    - T13 can proceed in parallel with T12 after the first representative product family is identified.
    - T14 should start as soon as candidate dependencies appear.
  prerequisite_artifacts:
    - Architecture baseline in `docs/architecture/001-knx-investigation-platform.md`
    - Implementation concept in `docs/implementation/001-solution-concept.md`
    - Proposed capability mappings in `docs/implementation/003-proposed-capability-apis.md`
    - Reviewed initial troubleshooting use cases
    - At least one representative `.knxproj` sample or sanitized structure description
    - At least one representative KNX bus-monitor trace or sanitized trace excerpt
    - Agreed required fields for `session-state.yaml`
    - Agreed project-refresh metadata for detecting `.knxproj` updates
  review_checkpoints:
    - Confirm the first stable capability contracts are traceable back to approved use cases.
    - Confirm the session model anchors one starting `.knxproj` file per investigation session.
    - Confirm session creation is blocked when no `.knxproj` file is provided.
    - Confirm the session stores the full absolute path of the bound `.knxproj` file.
    - Confirm session creation produces a unique work-directory and valid `session-state.yaml`.
    - Confirm every session-scoped capability performs project refresh detection before answering.
    - Confirm the agent layer asks for clarification instead of guessing unresolved names.
    - Confirm the normalized graph separates imported facts from inferred facts.
    - Confirm trace observations are stored separately from accepted scenario state and project facts.
    - Confirm CLI, SDK, and MCP payloads are contract-aligned for the same capability.
    - Confirm CLI and MCP execute the same callable core API that SDK tests exercise directly.
    - Confirm every delivered Python code slice includes pytest coverage.
    - Confirm MCP response payloads include provenance and limitation notes.
    - Confirm scenario inputs remain session-scoped and resettable.
    - Confirm the first simulation slice states unsupported behavior explicitly.
    - Confirm adopted Python dependencies satisfy the free-to-use license policy.
  completion_conditions:
    - A user or agent can create an investigation session anchored by a `.knxproj` input.
    - Each created session has a unique work-directory and persisted `session-state.yaml`.
    - Each session persists the full absolute path of its bound `.knxproj` file.
    - Updating the bound `.knxproj` file on disk causes automatic project re-read on the next CLI, SDK, or MCP call.
    - A `.knxproj` can be loaded and queried through MCP.
    - The same supported project-query capabilities are callable through CLI and SDK.
    - A KNX bus trace can be loaded and decoded into observations through MCP.
    - The same supported trace capabilities are callable through CLI and SDK.
    - Core capability behavior is covered by SDK-based pytest before adapter-level CLI and MCP validation.
    - The solution package passes pytest validation.
    - Session, setup, environment, user-action, mutation, log-book, and knowledge capability groups are available across the intended tool surfaces.
    - The delivered stable APIs map back to the prioritized use cases without uncovered mandatory workflow gaps.
    - The system can explain one end-to-end expected reaction path for a supported scenario.
    - At least one enriched component family can contribute behavior hints to a simulation result.
    - The system can infer at least one environment-related condition from trace evidence with explicit confidence.
    - All Python dependencies used by the delivered slices have a recorded free-to-use license decision.
    - Documented next steps exist for unsupported device behavior and live-trace integration.
  solution_surface: hybrid_agent
  top_level_runtime: instructed
  subagent_topology:
    - role: investigation-agent
      kind: instructed-agent
      responsibility: Conducts troubleshooting dialogue and orchestrates capability usage without guessing unresolved meaning.
    - role: session-service
      kind: coded-python-layer
      responsibility: Owns session creation, session persistence, and active-session resolution.
    - role: mutation-service
      kind: coded-python-layer
      responsibility: Owns mutation deltas, mutation persistence, and mutation-specific log books.
    - role: domain-core
      kind: coded-python-layer
      responsibility: Owns import, query, simulation, and enrichment logic.
    - role: mcp-server
      kind: coded-python-layer
      responsibility: Publishes structured tool surfaces over the domain core.
  phase_owners:
    - phase: architecture-and-concept
      owner: architect-planning-agent
    - phase: session-foundation
      owner: python-creation-agent
    - phase: agent-layer
      owner: instructed-agent-creation-agent
    - phase: domain-core-and-mcp
      owner: python-creation-agent
    - phase: quality-gate
      owner: qa-agent
  invocation_surfaces:
    sdk:
      status: generated
      rationale: Required programmable surface for deterministic domain-core operations.
    cli:
      status: generated
      rationale: Required deterministic surface for direct operator and automation use.
    mcp:
      status: generated
      rationale: Required agent-facing orchestration surface.
  log_point_matrix:
    - stage: project import
      owner: ets import adapter
      log_level: INFO
      summary_fields: session_id, project_id, ets_version, import_warning_count
      validation_expectation: Loading a project emits a summary event with stable counts and warnings.
    - stage: session lifecycle
      owner: session service
      log_level: INFO
      summary_fields: session_id, work_directory, source_project, lifecycle_action
      validation_expectation: Session creation and reopening emit stable lifecycle events with session context.
    - stage: project refresh check
      owner: session service
      log_level: DEBUG
      summary_fields: session_id, source_project_absolute_path, refresh_required, refresh_reason
      validation_expectation: Every session-scoped call emits a refresh-check event and re-imports before continuing when the source project changed.
    - stage: graph query
      owner: investigation service
      log_level: DEBUG
      summary_fields: session_id, query_type, target_id, result_count
      validation_expectation: Query execution emits a traceable event for debugging wrong answers.
    - stage: trace import
      owner: trace import adapter
      log_level: INFO
      summary_fields: session_id, trace_id, packet_count, decode_warning_count, linked_project_id
      validation_expectation: Trace loading emits a summary event with stable packet counts and decoding warnings.
    - stage: scenario update
      owner: scenario model
      log_level: INFO
      summary_fields: session_id, scenario_id, changed_fields, event_count
      validation_expectation: Scenario mutations are visible without leaking unrelated state or collapsing source provenance.
    - stage: log-book append
      owner: logbook service
      log_level: DEBUG
      summary_fields: session_id, mutation_name, entry_type, entry_id
      validation_expectation: Significant state-changing or answer-producing actions append traceable log-book entries.
    - stage: expectation simulation
      owner: expectation engine
      log_level: INFO
      summary_fields: session_id, scenario_id, trigger, predicted_reaction_count, unresolved_assumption_count
      validation_expectation: Each simulation result includes enough telemetry to inspect missing rule coverage.
    - stage: component enrichment
      owner: component knowledge adapter
      log_level: DEBUG
      summary_fields: product_key, source_count, extracted_hint_count
      validation_expectation: Enrichment runs record provenance breadth and extraction output.