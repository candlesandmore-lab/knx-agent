# Import warnings: archive description -> the COMPLETE set of warning codes (code -> count) and selected locations.
# The default description is clean: no warnings. Keys: id, patch, edits, mutations, expected_codes (exact
# multiset, {} = none), expected_locations (code -> exact location of the first warning with that code),
# expected_message_contains (code -> text in the message of the first warning with that code).
# Default ids: components P-0001-0_DI-1..3, objects 'P-0001-0_DI-<n>/co/<RefId>', group addresses P-0001-0_GA-1..3.

cases:
  - {id: clean-archive, expected_codes: {}}
  - id: master-missing
    mutations: [{op: remove, entry: master_xml}]
    expected_codes: {OPTIONAL_PART_MISSING: 1}
    expected_locations: {OPTIONAL_PART_MISSING: knx_master.xml}
  - id: master-malformed
    mutations: [{op: malform, entry: master_xml}]
    expected_codes: {OPTIONAL_PART_UNREADABLE: 1}
    expected_locations: {OPTIONAL_PART_UNREADABLE: knx_master.xml}
    expected_message_contains: {OPTIONAL_PART_UNREADABLE: "Optional part skipped (reason: XML_MALFORMED)"}
  - id: master-doctype
    mutations: [{op: doctype, entry: master_xml}]
    expected_codes: {OPTIONAL_PART_UNREADABLE: 1}
    expected_message_contains: {OPTIONAL_PART_UNREADABLE: "Optional part skipped (reason: XML_DTD_FORBIDDEN)"}
  - id: master-entity
    mutations: [{op: entity, entry: master_xml}]
    expected_codes: {OPTIONAL_PART_UNREADABLE: 1}
    expected_message_contains: {OPTIONAL_PART_UNREADABLE: "Optional part skipped (reason: XML_ENTITY_FORBIDDEN)"}
  - id: master-utf16
    mutations: [{op: utf16, entry: master_xml}]
    expected_codes: {OPTIONAL_PART_UNREADABLE: 1}
    expected_message_contains: {OPTIONAL_PART_UNREADABLE: "Optional part skipped (reason: XML_ENCODING_UNSUPPORTED)"}
  - id: hardware-missing
    mutations: [{op: remove, entry: hardware_xml}]
    expected_codes: {OPTIONAL_PART_MISSING: 1}
    expected_locations: {OPTIONAL_PART_MISSING: M-0001/Hardware.xml}
  - id: hardware-malformed
    mutations: [{op: malform, entry: hardware_xml}]
    expected_codes: {OPTIONAL_PART_UNREADABLE: 1}
    expected_locations: {OPTIONAL_PART_UNREADABLE: M-0001/Hardware.xml}
    expected_message_contains: {OPTIONAL_PART_UNREADABLE: "reason: XML_MALFORMED"}
  - id: hardware-doctype
    mutations: [{op: doctype, entry: hardware_xml}]
    expected_codes: {OPTIONAL_PART_UNREADABLE: 1}
    expected_message_contains: {OPTIONAL_PART_UNREADABLE: "reason: XML_DTD_FORBIDDEN"}
  - id: hardware-entity
    mutations: [{op: entity, entry: hardware_xml}]
    expected_codes: {OPTIONAL_PART_UNREADABLE: 1}
    expected_message_contains: {OPTIONAL_PART_UNREADABLE: "reason: XML_ENTITY_FORBIDDEN"}
  - id: hardware-utf16
    mutations: [{op: utf16, entry: hardware_xml}]
    expected_codes: {OPTIONAL_PART_UNREADABLE: 1}
    expected_message_contains: {OPTIONAL_PART_UNREADABLE: "reason: XML_ENCODING_UNSUPPORTED"}
  - id: application-program-doctype
    mutations: [{op: doctype, entry: "application_xml:M-0001_A-0001-01-AAAA"}]
    expected_codes: {OPTIONAL_PART_UNREADABLE: 1, COMOBJECT_DEFINITION_UNRESOLVED: 4, PARAMETER_DEFINITION_UNRESOLVED: 2}
    expected_locations: {OPTIONAL_PART_UNREADABLE: "M-0001/M-0001_A-0001-01-AAAA.xml"}
    expected_message_contains: {OPTIONAL_PART_UNREADABLE: "reason: XML_DTD_FORBIDDEN"}
  - id: application-program-entity
    mutations: [{op: entity, entry: "application_xml:M-0001_A-0001-01-AAAA"}]
    expected_codes: {OPTIONAL_PART_UNREADABLE: 1, COMOBJECT_DEFINITION_UNRESOLVED: 4, PARAMETER_DEFINITION_UNRESOLVED: 2}
    expected_message_contains: {OPTIONAL_PART_UNREADABLE: "reason: XML_ENTITY_FORBIDDEN"}
  - id: application-program-utf16
    mutations: [{op: utf16, entry: "application_xml:M-0001_A-0001-01-AAAA"}]
    expected_codes: {OPTIONAL_PART_UNREADABLE: 1, COMOBJECT_DEFINITION_UNRESOLVED: 4, PARAMETER_DEFINITION_UNRESOLVED: 2}
    expected_message_contains: {OPTIONAL_PART_UNREADABLE: "reason: XML_ENCODING_UNSUPPORTED"}
  - id: application-program-malformed
    mutations: [{op: malform, entry: "application_xml:M-0001_A-0001-01-AAAA"}]
    expected_codes: {OPTIONAL_PART_UNREADABLE: 1, COMOBJECT_DEFINITION_UNRESOLVED: 4, PARAMETER_DEFINITION_UNRESOLVED: 2}
    expected_message_contains: {OPTIONAL_PART_UNREADABLE: "reason: XML_MALFORMED"}
  - id: application-program-missing
    mutations: [{op: remove, entry: "application_xml:M-0001_A-0001-01-AAAA"}]
    expected_codes: {APPLICATION_PROGRAM_MISSING: 2}
    expected_locations: {APPLICATION_PROGRAM_MISSING: "P-0001/0.xml#P-0001-0_DI-1"}
  - id: product-reference-unresolved
    edits: [{path: "areas.0.lines.0.components.0.product", value: "M-0001_H-1_P-NOPE"}]
    expected_codes: {PRODUCT_REFERENCE_UNRESOLVED: 1}
    expected_locations: {PRODUCT_REFERENCE_UNRESOLVED: "P-0001/0.xml#P-0001-0_DI-1"}
  - id: application-program-reference-mismatch
    edits: [{path: "catalog.manufacturers.0.hardware.1.programs.0.app", value: "M-0001_A-0003-01-CCCC"}]
    expected_codes: {APPLICATION_PROGRAM_REFERENCE_MISMATCH: 1, COMOBJECT_DEFINITION_UNRESOLVED: 1}
    expected_locations: {APPLICATION_PROGRAM_REFERENCE_MISMATCH: "P-0001/0.xml#P-0001-0_DI-3"}
  - id: comobject-definition-unresolved
    edits: [{path: "areas.0.lines.0.components.0.objects.0.ref", value: "O-9_R-9"}]
    expected_codes: {COMOBJECT_DEFINITION_UNRESOLVED: 1}
    expected_locations: {COMOBJECT_DEFINITION_UNRESOLVED: "P-0001/0.xml#P-0001-0_DI-1/co/O-9_R-9"}
  - id: parameter-definition-unresolved
    edits: [{path: "areas.0.lines.0.components.1.parameters.0.ref", value: "M-0001_A-0001-01-AAAA_P-9_R-9"}]
    expected_codes: {PARAMETER_DEFINITION_UNRESOLVED: 1}
    expected_locations: {PARAMETER_DEFINITION_UNRESOLVED: "P-0001/0.xml#P-0001-0_DI-2/pa/M-0001_A-0001-01-AAAA_P-9_R-9"}
  - id: group-address-link-unresolved
    edits: [{path: "areas.0.lines.0.components.0.objects.0.links", value: [GA-999]}]
    expected_codes: {GROUP_ADDRESS_LINK_UNRESOLVED: 1}
    expected_locations: {GROUP_ADDRESS_LINK_UNRESOLVED: "P-0001/0.xml#P-0001-0_DI-1/co/O-0_R-1"}
  - id: device-reference-unresolved
    edits: [{path: "spaces.0.children.0.children.0.devices", append: DI-99}]
    expected_codes: {DEVICE_REFERENCE_UNRESOLVED: 1}
    expected_locations: {DEVICE_REFERENCE_UNRESOLVED: "P-0001/0.xml#P-0001-0_BP-3"}
  - id: datapoint-type-unknown
    edits: [{path: master_datapoints, value: [DPT-1, DPST-1-1]}]
    expected_codes: {DATAPOINT_TYPE_UNKNOWN: 1}
    expected_message_contains: {DATAPOINT_TYPE_UNKNOWN: DPST-5-1}
  - id: invalid-area-address-skips-subtree
    edits: [{path: "areas.0.address", value: abc}]
    expected_codes: {INVALID_ATTRIBUTE_VALUE: 1, DEVICE_REFERENCE_UNRESOLVED: 2}
  - id: invalid-component-address
    edits: [{path: "areas.0.lines.0.components.1.address", value: ""}]
    expected_codes: {INVALID_ATTRIBUTE_VALUE: 1, DEVICE_REFERENCE_UNRESOLVED: 1}
    expected_locations: {INVALID_ATTRIBUTE_VALUE: "P-0001/0.xml#P-0001-0_DI-2"}
  - id: invalid-group-address-not-numeric
    edits: [{path: "group_ranges.0.ranges.0.addresses.2.address", value: x}]
    expected_codes: {INVALID_ATTRIBUTE_VALUE: 1, GROUP_ADDRESS_LINK_UNRESOLVED: 1}
  - id: invalid-group-address-out-of-range
    edits: [{path: "group_ranges.0.ranges.0.addresses.2.address", value: 70000}]
    expected_codes: {INVALID_ATTRIBUTE_VALUE: 1, GROUP_ADDRESS_LINK_UNRESOLVED: 1}
  - id: duplicate-id
    edits: [{path: "areas.0.lines.0.components.1.id", value: DI-1}]
    expected_codes: {DUPLICATE_ID: 1, DEVICE_REFERENCE_UNRESOLVED: 1}
    expected_locations: {DUPLICATE_ID: "P-0001/0.xml#P-0001-0_DI-1"}
  - id: structural-fallback-component
    edits: [{path: "areas.0.lines.0.components.0.omit_id", value: true}]
    expected_codes: {STRUCTURAL_ID_FALLBACK: 1, DEVICE_REFERENCE_UNRESOLVED: 1}
  - id: structural-fallback-area-line-space-group-address
    edits:
      - {path: "areas.0.omit_id", value: true}
      - {path: "areas.0.lines.0.omit_id", value: true}
      - {path: "spaces.0.omit_id", value: true}
      - {path: "group_ranges.0.ranges.0.addresses.1.omit_id", value: true}
    expected_codes: {STRUCTURAL_ID_FALLBACK: 4, GROUP_ADDRESS_LINK_UNRESOLVED: 1}   # GA-2 lost its Id, so Links GA-2 dangles
  - id: unsupported-scene-like-element
    mutations: [{op: replace, entry: zero_xml, old: "</Installation>", new: "<SceneTable/></Installation>"}]
    expected_codes: {UNSUPPORTED_ELEMENT: 1}
    expected_locations: {UNSUPPORTED_ELEMENT: "P-0001/0.xml#SceneTable"}
  - id: mapped-scene-has-no-ets-id
    edits: [{path: scenes, value: [{name: Evening, number: 3, members: ["P-0001-0_DI-1"]}]}]
    expected_codes: {STRUCTURAL_ID_FALLBACK: 1}
  - id: second-installation-file
    mutations: [{op: second_installation}]
    expected_codes: {ADDITIONAL_INSTALLATION_IGNORED: 1}
    expected_locations: {ADDITIONAL_INSTALLATION_IGNORED: P-0001/1.xml}
