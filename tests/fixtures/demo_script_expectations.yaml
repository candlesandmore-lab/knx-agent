# Expectations of tests/test_demo_scripts.py for the demo scripts in ./demo (story 06). User-editable.
#
# scripts: run in file order against ONE temporary session root (01 creates the session that 02..07 use).
#   exit_code  exit code of the script
#   results    the RESULT lines the script must print: "RESULT <id> exit=<n> <name>=<value> ..."
#     id          call id
#     exit        exit code of the CLI call
#     error_code  error code expected on the RESULT line (error examples)
#     fields      name -> literal (string compare) or {min: N} (integer >= N)
# Counts of the sample are asserted as minimums or structure only; golden counts live in sample_project_counts.yaml.

scripts:
  - script: 01-create-session.sh
    exit_code: 0
    results:
      - {id: create, exit: 0, fields: {session_label: demo-house, components: {min: 1}, group_addresses: {min: 1}, warnings: {min: 0}}}

  - script: 02-describe-and-reimport.sh
    exit_code: 0
    results:
      - {id: describe, exit: 0, fields: {last_status: UNCHANGED, reimport_count: {min: 0}, components: {min: 1}}}
      - {id: describe_debug, exit: 0, fields: {session_label: demo-house}}
      - {id: reimport, exit: 0, fields: {status: UNCHANGED, changes: "0", invalidated: "0"}}

  - script: 03-list-components.sh
    exit_code: 0
    results:
      - {id: pick, exit: 0}
      - {id: list_all, exit: 0, fields: {count: {min: 1}, ambiguous: "False"}}
      - {id: by_name, exit: 0, fields: {count: {min: 2}, ambiguous: "True"}}
      - {id: by_address, exit: 0, fields: {count: "1", kinds: INDIVIDUAL_ADDRESS}}
      - {id: by_ets_id, exit: 0, fields: {count: "1", kinds: ETS_ID}}
      - {id: by_path_location, exit: 0, fields: {count: {min: 1}}}
      - {id: level_summary, exit: 0, fields: {count: {min: 1}, has_topology: "False"}}
      - {id: level_medium, exit: 0, fields: {count: {min: 1}, has_topology: "True", has_objects: "False"}}
      - {id: level_full, exit: 0, fields: {count: {min: 1}, has_objects: "True"}}

  - script: 04-describe-component.sh
    exit_code: 0
    results:
      - {id: pick, exit: 0}
      - {id: describe_medium, exit: 0, fields: {count: "1", has_topology: "True", has_objects: "False"}}
      - {id: describe_full, exit: 0, fields: {count: "1", objects: {min: 1}, group_addresses: {min: 1}}}

  - script: 05-summarize-topology.sh
    exit_code: 0
    results:
      - {id: topology_summary, exit: 0, fields: {areas: {min: 1}, lines: {min: 1}, locations: {min: 1}, total: {min: 1}, placed: {min: 1}}}
      - {id: topology_medium, exit: 0, fields: {total: {min: 1}, area_entries: {min: 1}, location_entries: {min: 1}}}
      - {id: topology_full, exit: 0, fields: {total: {min: 1}, location_entries: {min: 1}}}

  - script: 06-trace-group-flow.sh
    exit_code: 0
    results:
      - {id: pick, exit: 0}
      - {id: flow_by_address, exit: 0, fields: {count: "1", ambiguous: "False", participants: {min: 1}, value: unknown}}
      - {id: flow_by_name, exit: 0, fields: {count: {min: 2}, ambiguous: "True"}}
      - {id: flow_by_object, exit: 0, fields: {count: {min: 1}, participants: {min: 1}}}

  - script: 07-errors.sh
    exit_code: 0
    results:
      # exact calls: session describe --session demo-no-such-session;
      # setup describe-component --component no-such-component-xyz; setup trace-group-flow --group-address 31/7/255
      - {id: err_session_not_found, exit: 1, error_code: SESSION_NOT_FOUND}
      - {id: err_selector_unresolved_component, exit: 1, error_code: SELECTOR_UNRESOLVED}
      - {id: err_selector_unresolved_group_address, exit: 1, error_code: SELECTOR_UNRESOLVED}

run_all:
  exit_code: 0
  summary_line: "Tour complete: 7 of 7 scripts passed"

actions:
  - session create
  - session describe
  - session reimport
  - setup list-components
  - setup describe-component
  - setup summarize-topology
  - setup trace-group-flow

detail_levels_used: [SUMMARY, MEDIUM, FULL]

# The family name of the sample project owner. The only allowed occurrence under demo/ is the exact sample file name.
family_name: armbruster
sample_file_name: 20261010-EFH-Armbruster.knxproj

demo_rule_line: "Demo rule (todo 16): once implemented, add examples for new actions/features to ./demo (scripts and README) and keep existing demo scripts working."
todos_with_demo_rule: ["05", "06", "07", "08", "09", "10", "11", "14"]
todos_without_demo_rule: ["12", "13"]

# cleanup.sh refusals: exit code 2, "refused" on stderr, the message part below, and the target must survive.
# target names the kind of path the test builds (see tests/test_demo_scripts.py); dry_run adds --dry-run (used for the
# paths that would be dangerous if a refusal ever failed).
cleanup_refusals:
  - {id: empty_string, target: empty_string, dry_run: false, message: "empty"}
  - {id: whitespace_string, target: whitespace_string, dry_run: false, message: "empty"}
  - {id: filesystem_root, target: filesystem_root, dry_run: true, message: "filesystem root"}
  - {id: repository_root, target: repository_root, dry_run: true, message: "repository"}
  - {id: repository_parent, target: repository_parent, dry_run: true, message: "repository"}
  - {id: demo_folder, target: demo_folder, dry_run: true, message: "folder of this repository"}
  - {id: throwaway_home, target: throwaway_home, dry_run: false, message: "home directory"}
  - {id: missing_explicit_path, target: missing_explicit_path, dry_run: false, message: "not an existing directory"}
  - {id: regular_file, target: regular_file, dry_run: false, message: "not an existing directory"}
  - {id: symlink_to_sessions_dir, target: symlink_to_sessions_dir, dry_run: false, message: "symbolic link"}
  - {id: plain_directory_with_file, target: plain_directory_with_file, dry_run: false, message: "not a session folder"}
  - {id: foreign_subfolder_directory, target: foreign_subfolder_directory, dry_run: false, message: "does not look like"}
