[project]
name = "knx-agent"
version = "0.1.0"
description = "KNX investigation platform: shared core API with SDK, CLI and MCP tool surfaces."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "typer>=0.12",
    "mcp>=2,<3",
    "pyyaml>=6",
]

[project.scripts]
knx-agent = "knx_agent.cli:main"
knx-agent-mcp = "knx_agent.adapters.mcp:mcp"

[dependency-groups]
dev = [
    "pytest>=8.0",
    # Development tooling: keeps agent-dev-agent in the lock file so a plain `uv sync` does not remove it.
    "agent-building-agent",
    # Dev-time cross-check only (story 04): GPL-2.0 per package metadata, never a runtime dependency,
    # never imported by src/.
    "xknxproject>=3.10.0",
]

[tool.uv.sources]
agent-building-agent = { path = "agent-dev-agent/agent-dev-agent/agent_building_agent-0.6.2-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knx_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
